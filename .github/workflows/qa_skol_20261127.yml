          hmin=min(x for x in hd if x);hmax=max(hd)
          results=collections.defaultdict(collections.Counter); missing=collections.defaultdict(collections.Counter); unit_results=collections.defaultdict(collections.Counter); five=[]; patterns=collections.Counter(); multi_patterns=collections.Counter(); missing_dates=collections.Counter()
          for g,oo in groups.items():
