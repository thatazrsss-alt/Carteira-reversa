name: QA 27-11 - motivos residuais entrada unica
on:
  push:
    branches: ['qa/skol-20261127']
    paths: ['.github/workflows/qa_skol_20261127.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconciliar todos os SKUs
        run: |
          python - <<'PY'
          import csv,io,zipfile,re,unicodedata,collections,json,decimal,datetime
          D=decimal.Decimal
          import functools
          @functools.lru_cache(maxsize=250000)
          def n(x):
              s=unicodedata.normalize('NFKC',str(x or '')).strip().upper()
              s=re.sub(r'[\s\u200b\ufeff]+','',s)
              if re.fullmatch(r'\d+(\.0+)?',s): return str(int(s.split('.')[0]))
              return s
          def hdr(x):
              return re.sub(r'[^a-z0-9]','',unicodedata.normalize('NFKD',x).encode('ascii','ignore').decode().lower())
          @functools.lru_cache(maxsize=20000)
          def day(x):
              s=str(x or '').strip()
              for fmt in ('%d/%m/%Y','%Y-%m-%d'):
                  try:
                      d=datetime.datetime.strptime(s[:10],fmt).date()
                      return d.isoformat() if d.year>1900 else ''
                  except ValueError: pass
              return ''
          @functools.lru_cache(maxsize=100000)
          def q(x):
              s=str(x or '').strip()
              if not s:return D(0)
              if ',' in s:s=s.replace('.','').replace(',','.')
              try:return D(s)
              except decimal.InvalidOperation:return None
          def rows(path):
              with zipfile.ZipFile(path) as z:
                  names=[i for i in z.namelist() if i.lower().endswith('.csv')]
                  assert len(names)==1, names
                  raw=z.read(names[0]).rstrip(b'\0')
              try: txt=raw.decode('utf-8-sig')
              except UnicodeDecodeError: txt=raw.decode('cp1252')
              r=csv.DictReader(io.StringIO(txt),delimiter=';')
              print('SCHEMA',path,json.dumps(r.fieldnames,ensure_ascii=False))
              return r
          def find(r,*aliases):
              return next((r[k] for k in aliases if k in r),'')
          def orderrow(r):
              return {'p':n(find(r,'Nº Pedido ERP','Número Pedido ERP')),'client':n(find(r,'Cliente EG')),'sku':n(find(r,'SKU EG')),'code':n(find(r,'Código Produto Cliente')),'ean':n(find(r,'EAN')),'date':day(find(r,'Data Captação ECC','Data Captação')),'valid':day(find(r,'Data de Vencimento','Data Vencimento')),'cnpj':n(find(r,'CNPJ Cliente','CNPJ','CNPJ do Cliente')),'created':day(find(r,'Data de Criação')),'original_valid':day(find(r,'Data de Vencimento Original')),'item':n(find(r,'Número do Item')),'net':n(find(r,'Nome Rede')),'origin':n(find(r,'Origem')),'realoc':n(find(r,'Tipo de realocação')),'realoc_qty':q(find(r,'Qtd. Realocada')),'order_id':n(find(r,'Nº Pedido Ambev')),'sap':n(find(r,'SKU SAP')),'desc':n(find(r,'Descrição Produto Cliente')),'bees':n(find(r,'Nº Pedido Bees AS')),'status':n(find(r,'Status')),'unit':n(find(r,'Unidade')),'original':q(find(r,'Qtd. Original')) if str(find(r,'Qtd. Original') or '').strip() else None,'mode':n(find(r,'Modo')),'channel':n(find(r,'Tipo Pedido')),'qty':[q(find(r,k)) for k in ('Qtd. Atualizada','Qtd. Carro com remessa','Qtd. Carro sem remessa','Qtd. Faturada')]}
          def histrow(r):
              return {'p':n(find(r,'Nº Pedido ERP','Número Pedido ERP')),'code':n(find(r,'Código Produto Cliente')),'ean':n(find(r,'EAN')),'date':day(find(r,'Data de Criação','Data Criação')),'valid':day(find(r,'Data de Vencimento','Data Vencimento')),'cnpj':n(find(r,'CNPJ Cliente','CNPJ','CNPJ do Cliente')),'desc':n(find(r,'Descrição Produto Cliente')),'bees':n(find(r,'Nº Pedido Bees AS')),'item':n(find(r,'Número do Item','Nº Item','Item')),'qty':q(find(r,'Qtd. Pedida'))}
          op='2026.11.27_10.22 ExportReportOrderItem ultimo.zip'
          hp='2026.11.27_10.24 ExportReportOrderHistory ultimo.zip'
          ref='2026-11-27'
          src=collections.Counter(); groups=collections.defaultdict(list); erps=set(); units=collections.Counter(); nets=set(); skus=set()
          for r in rows(op):
              src['order_rows']+=1
              o=orderrow(r); g=(o['p'],o['client'],o['sku'])
              if not all(g) or 'TESTE' in g[0]:
                  src['order_excluded']+=1;continue
              groups[g].append(o);erps.add(g[0]);units[o['unit']]+=1;nets.add(o['net']);skus.add(g[2])
          # History grain: original ERP, client CNPJ, client product (or EAN), creation and original validity.
          # The item number is not part of the entry key; equal repeated quantities are counted once.
          entries=collections.defaultdict(lambda:{'qty':set(),'ids':set(),'rows':0,'items':set()})
          he=set(); hd=collections.Counter(); hr=0; missing_id=0
          for r in rows(hp):
              hr+=1;h=histrow(r);p=h['p']
              if not p:continue
              he.add(p);hd[h['date']]+=1
              if p not in erps:continue
              prod=h['code'] or h['ean']
              if not prod:missing_id+=1;continue
              k=(p,h['cnpj'],prod,h['date'],h['valid'])
              z=entries[k];z['qty'].add(h['qty']);z['ids'].update({h['code'],h['ean']}-{''});z['rows']+=1;z['items'].add(h['item'])
          index=collections.defaultdict(set); rawindex=collections.defaultdict(set)
          for k,e in entries.items():
              for v in e['ids']:
                  index[(k[0],k[1],v)].add(k);rawindex[(k[0],v)].add(k)
          def validline(o):return bool(o['valid'] and o['valid']>=ref and 'CANCELAD' not in o['status'] and 'AGUARDANDOCANCELAMENTO' not in o['status'])
          # Prefer original creation/validity, then capture as secondary diagnostic. Current validity is not a key.
          # One qualifying journey line is sufficient; later lines do not need to re-match.
          bygroup={};owners=collections.defaultdict(set);relaxedown=collections.defaultdict(set)
          for g,oo in groups.items():
              p,c,sku=g;strict=set();cap=set();relaxed=set();raw=set();eg_sap=set(); matches=collections.defaultdict(list)
              for o in oo:
                  # compare identifiers in either named column; never rely on quantity to identify the entry
                  for v in {o['code'],o['ean']}-{''}:
                      raw.update(rawindex[(p,v)])
                      for k in index[(p,o['cnpj'],v)]:
                          if not o['cnpj']:continue
                          relaxed.add(k)
                          if k[3] and k[4] and o['created']==k[3] and o['original_valid']==k[4]:
                              strict.add(k);matches[k].append(o)
                          elif k[3] and k[4] and o['date']==k[3] and o['original_valid']==k[4]:
                              cap.add(k);matches[k].append(o)
                  for v in {o['sku'],o['sap']}-{''}:
                      for k in index[(p,o['cnpj'],v)]:
                          if o['cnpj'] and k[3] and k[4] and k[3] in {o['created'],o['date']} and k[4]==o['original_valid']:eg_sap.add(k)
              selected=strict|cap
              bygroup[g]=(strict,cap,relaxed,raw,eg_sap,matches)
              for k in selected:owners[k].add(g)
              for k in relaxed:relaxedown[k].add(g)
          # Test EG/SAP identities separately, and prevent reuse of existing History entries.
          skuowners=collections.defaultdict(set); sku_cands={}; sku_methods=collections.defaultdict(set)
          for g,oo in groups.items():
              p,c,sku=g;cs=set();methods=collections.defaultdict(set)
              for o in oo:
                  if not o['cnpj']:continue
                  for f in ('sku','sap'):
                      v=o[f]
                      if not v:continue
                      for k in index[(p,o['cnpj'],v)]:
                          if k[3] and k[4] and k[3] in {o['created'],o['date']} and k[4]==o['original_valid']:
                              cs.add(k);methods[k].add(f)
              sku_cands[g]=cs
              for k in cs:
                  skuowners[k].add(g)
                  sku_methods[(g,k)].update(methods[k])
          # First-pass assignments are identical to previous audit.
          assigned={};used=collections.defaultdict(set)
          for g,oo in groups.items():
              strict,cap,relaxed,raw,eg_sap,matches=bygroup[g]
              base={k for k in strict|cap if owners[k]=={g}}
              if len(base)==1:k=next(iter(base))
              elif not base:
                  cs=sku_cands[g];avail={k for k in cs if skuowners[k]=={g} and not (owners[k]-{g})}
                  k=next(iter(avail)) if len(cs)==1 and len(avail)==1 else None
              else:k=None
              if k is not None:assigned[g]=k;used[k].add(g)
          # Relax dates and CNPJ in separate diagnostic steps; no quantity used for identity.
          all_rel=collections.defaultdict(set); all_ro=collections.defaultdict(set); all_raw=collections.defaultdict(set)
          for g,oo in groups.items():
              p,c,sku=g
              for o in oo:
                  for v in {o['code'],o['ean'],o['sku'],o['sap']}-{''}:
                      all_raw[g].update(rawindex[(p,v)])
                      if o['cnpj']:all_rel[g].update(index[(p,o['cnpj'],v)])
              for k in all_rel[g]:all_ro[k].add(g)
          reasons=collections.defaultdict(collections.Counter); rec=collections.defaultdict(collections.Counter); qty=collections.defaultdict(collections.Counter); bynet=collections.defaultdict(collections.Counter); vol=collections.defaultdict(lambda:collections.defaultdict(lambda:D(0))); qtynet=collections.defaultdict(collections.Counter); examples=collections.defaultdict(list)
          hmin=min(x for x in hd if x)
          for g,oo in groups.items():
              p,c,sku=g;live=any(validline(o) for o in oo);livep=sum((o['qty'][0]-sum(o['qty'][1:]) for o in oo if validline(o) and None not in o['qty']),D(0));cx=all(o['unit']=='CX' for o in oo)
              orig={o['original'] for o in oo if o['original'] is not None}
              net=next(iter(sorted({o['net'] for o in oo if o['net']})),'SEM_REDE')
              labs=['all']+(['active'] if live else [])+(['active_pending'] if livep>0 else [])
              if g in assigned:
                  k=assigned[g];qs=entries[k]['qty']
                  if len(qs)!=1 or None in qs:
                      b='History tem mais de uma quantidade na mesma chave'
                  elif next(iter(qs)) in orig:continue
                  else:
                      hq=next(iter(qs));peritem=collections.defaultdict(set)
                      for o in oo:peritem[(o['order_id'],o['item'])].add(o['original'])
                      isum=sum((next(iter(v)) for v in peritem.values()),D(0)) if all(len(v)==1 and None not in v for v in peritem.values()) else None
                      if len(orig)>1 and sum(orig,D(0))==hq:b='Soma dos originais distintos coincide (investigar desdobramento)'
                      elif isum==hq:b='Soma por pedido Ambev e item coincide (investigar desdobramento)'
                      elif any(o['realoc_qty'] and o['realoc_qty']>0 for o in oo):b='Realocacao registrada, quantidade ainda divergente'
                      elif len(oo)>1:b='Multiplas linhas, sem igualdade nos testes'
                      else:b='Linha unica com quantidade diferente'
                  for lab in labs:
                      qty[lab][b]+=1
                      if cx:vol[lab]['qty_difference_pending_CX']+=livep
                      qtynet[lab][net]+=1
                  if live and len(examples[b])<3:
                      examples[b].append({'history_quantities':sorted(str(x) for x in qs),'order_original_values':sorted(str(x) for x in orig),'order_rows':len(oo),'unit':oo[0]['unit'],'realocation_present':any(o['realoc_qty'] and o['realoc_qty']>0 for o in oo)})
                  continue
              rel=all_rel[g];raw=all_raw[g]; available={k for k in rel if not used[k] and all_ro[k]=={g}}
              strict,cap,_,_,_,_=bygroup[g];samedate=strict|cap|sku_cands[g]
              if p not in he:
                  b='ERP ausente no History'
              elif samedate:
                  b='Chave candidata disputada ou multipla'
              elif rel:
                  b='Produto e CNPJ iguais, datas divergentes'
              elif raw:
                  b='Produto igual no ERP, CNPJ divergente'
              else:
                  b='ERP existe, nenhum codigo do produto coincide'
              for lab in labs:
                  reasons[lab][b]+=1
                  if cx:vol[lab]['unmatched_pending_CX']+=livep;vol[lab][b+'_pending_CX']+=livep
                  if p not in he:
                      rec[lab]['erp_absent_before_history']+=all(o['date'] and o['date']<hmin for o in oo)
                      rec[lab]['erp_absent_without_capture']+=not any(o['date'] for o in oo)
                  if len(rel)==1 and len(available)==1:
                      k=next(iter(available));qs=entries[k]['qty'];rec[lab]['exclusive_relaxed_dates']+=1
                      rec[lab]['exclusive_relaxed_dates_qty_equal']+=len(qs)==1 and bool(qs&orig)
                      rec[lab]['exclusive_relaxed_dates_creation_equal']+=any(k[3] and k[3]==o['created'] for o in oo)
                      rec[lab]['exclusive_relaxed_dates_original_valid_equal']+=any(k[4] and k[4]==o['original_valid'] for o in oo)
                  rec[lab]['missing_capture']+=not any(o['date'] for o in oo)
                  rec[lab]['missing_creation']+=not any(o['created'] for o in oo)
                  rec[lab]['missing_original_validity']+=not any(o['original_valid'] for o in oo)
                  bynet[lab][net]+=1
          print('QA_RESIDUAL',json.dumps({'assigned_groups':len(assigned),'cross_assignment_conflicts':sum(len(x)>1 for x in used.values()),'unmatched_reasons':{k:dict(v) for k,v in reasons.items()},'diagnostic':{k:dict(v) for k,v in rec.items()},'quantity_reasons':{k:dict(v) for k,v in qty.items()},'volumes':{k:{a:str(b) for a,b in v.items()} for k,v in vol.items()},'unmatched_network_top':{k:v.most_common(10) for k,v in bynet.items()},'quantity_network_top':{k:v.most_common(10) for k,v in qtynet.items()},'quantity_examples':dict(examples)},ensure_ascii=False))
          PY
