name: QA SKOL 27-11 - aliases CAD
on:
  push:
    branches: ['qa/skol-20261127']
    paths: ['.github/workflows/qa_skol_20261127.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install openpyxl
      - name: Reconciliar SKU 360248
        run: |
          python - <<'PY'
          import csv,io,zipfile,re,unicodedata,collections,json,decimal,datetime
          D=decimal.Decimal
          def n(x):
              s=unicodedata.normalize('NFKC',str(x or '')).strip().upper()
              s=re.sub(r'[\s\u200b\ufeff]+','',s)
              if re.fullmatch(r'\d+(\.0+)?',s): return str(int(s.split('.')[0]))
              return s
          def hdr(x):
              return re.sub(r'[^a-z0-9]','',unicodedata.normalize('NFKD',x).encode('ascii','ignore').decode().lower())
          def day(x):
              s=str(x or '').strip()
              for fmt in ('%d/%m/%Y','%Y-%m-%d'):
                  try: return datetime.datetime.strptime(s[:10],fmt).date().isoformat()
                  except ValueError: pass
              return ''
          def q(x):
              s=str(x or '').strip()
              if not s:return D(0)
              if ',' in s:s=s.replace('.','').replace(',','.')
              try:return D(s)
              except decimal.InvalidOperation:return None
          def rows(path):
              with zipfile.ZipFile(path) as z:
                  names=[i for i in z.namelist() if i.lower().endswith('.csv')]
                  assert len(names)==1, names
                  raw=z.read(names[0]).rstrip(b'\0')
              try: txt=raw.decode('utf-8-sig')
              except UnicodeDecodeError: txt=raw.decode('cp1252')
              r=csv.DictReader(io.StringIO(txt),delimiter=';')
              print('SCHEMA',path,json.dumps(r.fieldnames,ensure_ascii=False))
              return r
          def find(r,*aliases):
              m={hdr(k):v for k,v in r.items() if k is not None}
              return next((m[hdr(k)] for k in aliases if hdr(k) in m),'')
          def orderrow(r):
              return {'p':n(find(r,'Nº Pedido ERP','Número Pedido ERP')),'client':n(find(r,'Cliente EG')),'sku':n(find(r,'SKU EG')),'code':n(find(r,'Código Produto Cliente')),'ean':n(find(r,'EAN')),'date':day(find(r,'Data Captação ECC','Data Captação')),'valid':day(find(r,'Data de Vencimento','Data Vencimento')),'cnpj':n(find(r,'CNPJ Cliente','CNPJ','CNPJ do Cliente')),'created':day(find(r,'Data de Criação')),'original_valid':day(find(r,'Data de Vencimento Original')),'item':n(find(r,'Número do Item')),'net':n(find(r,'Nome Rede')),'status':n(find(r,'Status')),'unit':n(find(r,'Unidade')),'qty':[q(find(r,k)) for k in ('Qtd. Atualizada','Qtd. Carro com remessa','Qtd. Carro sem remessa','Qtd. Faturada')]}
          def histrow(r):
              return {'p':n(find(r,'Nº Pedido ERP','Número Pedido ERP')),'code':n(find(r,'Código Produto Cliente')),'ean':n(find(r,'EAN')),'date':day(find(r,'Data de Criação','Data Criação')),'valid':day(find(r,'Data de Vencimento','Data Vencimento')),'cnpj':n(find(r,'CNPJ Cliente','CNPJ','CNPJ do Cliente')),'desc':n(find(r,'Descrição Produto Cliente')),'item':n(find(r,'Número do Item','Nº Item','Item')),'qty':q(find(r,'Qtd. Pedida'))}
          import openpyxl
          wb=openpyxl.load_workbook('BASE_ESTOQUE 16.11.xlsx',read_only=True,data_only=True)
          print('SHEETS',wb.sheetnames)
          cad=next(x for x in wb if hdr(x.title)=='cad')
          cadrows=list(cad.values)
          # Inspect target row and matching identifiers only, not other commercial data.
          hits=[]; idxs=[]
          for i,row in enumerate(cadrows):
              vals=[n(v) for v in row]
              if '360248' in vals or '7891991308267' in vals or '91373' in vals:
                  idxs.append(i);hits.append([(j+1,str(v)) for j,v in enumerate(row) if v is not None])
          print('CAD_HEADERS',json.dumps([str(v or '') for v in cadrows[0]],ensure_ascii=False))
          print('CAD_TARGET_COUNT',len(hits))
          # EAN columns identified by header, not fixed offsets.
          hidx=next((i for i,row in enumerate(cadrows[:10]) if any('ean' in hdr(str(v or '')) for v in row)),None)
          alias=set()
          sku_col=None
          if hidx is not None:
              headers=[hdr(str(v or '')) for v in cadrows[hidx]]
              ecols=[j for j,v in enumerate(headers) if 'ean' in v or 'gtin' in v or 'codigobarras' in v]
              skucols=[j for j,v in enumerate(headers) if 'eg' in v and ('sku' in v or 'cod' in v or 'material' in v or v=='eg')]
              if not skucols:
                  skucols=[j for j,v in enumerate(headers) if v in ('eg','codprod')]
              sku_col=next((j for j in skucols if any(n(cadrows[i][j])=='360248' for i in idxs)),None)
              if sku_col is not None:
                  for row in cadrows[hidx+1:]:
                      if n(row[sku_col])=='360248':
                          alias.update(n(row[j]) for j in ecols if row[j] is not None and n(row[j]))
              print('CAD_KEYS',json.dumps({'headers':headers,'ean_cols':ecols,'sku_col':sku_col,'aliases':sorted(alias)}))
          order=collections.defaultdict(list); ids=collections.defaultdict(set); caps=collections.Counter()
          op='2026.11.27_10.22 ExportReportOrderItem ultimo.zip'
          hp='2026.11.27_10.24 ExportReportOrderHistory ultimo.zip'
          for r in rows(op):
              if n(r.get('SKU EG'))=='360248':
                  o=orderrow(r);order[o['p']].append(o)
          # Include every other SKU of the relevant ERP to check candidate ownership.
          for r in rows(op):
              p=n(r.get('Nº Pedido ERP'))
              if p not in order:continue
              for k in ('EAN','Código Produto Cliente'):
                  v=n(r.get(k))
                  if v:ids[(p,n(r.get('CNPJ Cliente')),v)].add(n(r.get('SKU EG')))
          hist=collections.defaultdict(list); allhdates=collections.Counter()
          for r in rows(hp):
              p=n(r.get('Nº Pedido ERP'))
              allhdates[day(r.get('Data de Criação'))]+=1
              if p in order:hist[p].append(histrow(r))
          def match(o,h):
              return (o['ean'] and o['ean']==h['ean']) or (o['code'] and o['code']==h['code'])
          def comp(o,h,alt=False):
              return (not(o['cnpj'] and h['cnpj']) or o['cnpj']==h['cnpj']) and (not(o['date'] and h['date']) or h['date']==o['date'] or (alt and h['date']==o['created'])) and (not(o['valid'] and h['valid']) or h['valid']==o['valid'] or (alt and h['valid']==o['original_valid']))
          def uq(hh):
              return {(h['item'],h['code'],h['ean'],h['date'],h['valid'],h['cnpj'],h['qty']) for h in hh}
          group=collections.defaultdict(list)
          for p,oo in order.items():
              for o in oo:group[(p,o['client'])].append(o)
          counts=collections.Counter(); missing=collections.Counter(); alt=collections.Counter(); candidates=collections.Counter(); cadconf=collections.Counter(); unmatched=collections.Counter(); no_context=collections.Counter(); namepat=collections.Counter(); nets=collections.Counter(); active=collections.Counter()
          for (p,c),oo in group.items():
              hh=hist[p]
              direct=[h for h in hh if any(match(o,h) and comp(o,h) for o in oo)]
              isactive=any(o['valid']>='2026-11-27' and 'CANCELAD' not in o['status'] for o in oo)
              if len(uq(direct))==1:
                  counts['direct']+=1
                  if isactive:active['direct']+=1
                  continue
              if not hh:
                  counts['no_erp']+=1
                  if isactive:active['no_erp']+=1
                  missing['cap_missing']+=not any(o['date'] for o in oo)
                  missing['creation_missing']+=not any(o['created'] for o in oo)
                  missing['cancelled_all']+=all('CANCELAD' in o['status'] for o in oo)
                  missing['all_active_valid']+=isactive
                  missing['cap_outside_history_range']+=all(not o['date'] or o['date']<min(x for x in allhdates if x) or o['date']>max(allhdates) for o in oo)
                  continue
              same=[h for h in hh if any(match(o,h) for o in oo)]
              if same:
                  counts['date_or_valid']+=1
                  if isactive:active['date_or_valid']+=1
                  aa=[h for h in same if any(match(o,h) and comp(o,h,True) for o in oo)]
                  alt['recovered_unique']+=len(uq(aa))==1
                  alt['creation_equal']+=any(o['created'] and o['created']==h['date'] and o['date']!=h['date'] and match(o,h) for o in oo for h in same)
                  alt['original_valid_equal']+=any(o['original_valid'] and o['original_valid']==h['valid'] and o['valid']!=h['valid'] and match(o,h) for o in oo for h in same)
                  continue
              counts['no_code']+=1
              if isactive:active['no_code']+=1
              # Use CAD EAN aliases only and require unambiguous ownership within ERP/CNPJ.
              cc=[h for h in hh if any(comp(o,h,True) and bool({h['ean'],h['code']}&alias) for o in oo)]
              clean=[h for h in cc if not any(ids.get((p,h['cnpj'],v),set())-{'360248'} for v in (h['ean'],h['code']) if v)]
              cadconf['candidate_any']+=bool(cc);cadconf['unique']+=len(uq(cc))==1;cadconf['unique_no_other_sku']+=len(uq(clean))==1 and len(uq(cc))==1
              allcad=[h for h in hh if bool({h['ean'],h['code']}&alias)]
              cadconf['any_cad_alias_without_context']+=bool(allcad)
              for v in {h['ean'] for h in allcad if h['ean']}:no_context[v]+=1
              unowned=[h for h in hh if any(comp(o,h,True) for o in oo) and not any(ids.get((p,h['cnpj'],v),set()) for v in (h['ean'],h['code']) if v)]
              cadconf['unowned_history_unique']+=len(uq(unowned))==1
              for v in {h['ean'] for h in unowned if h['ean']}:unmatched[v]+=1
              # Description and item number are diagnostic, never automatic approval.
              dd=[h for h in hh if 'SKOL' in h['desc'] and ('ZERO' in h['desc'] or 'SEMALCOOL' in h['desc']) and any(comp(o,h,True) for o in oo)]
              namepat['description_any']+=bool(dd);namepat['description_unique']+=len(uq(dd))==1
              ii=[h for h in hh if any(o['item'] and o['item']==h['item'] and comp(o,h,True) for o in oo)]
              namepat['item_unique']+=len(uq(ii))==1
              for v in {h['ean'] for h in dd if h['ean']}:candidates[v]+=1
              for v in {h['ean'] for h in ii if h['ean']}:nets[v]+=1
          print('QA_FINAL',json.dumps({'counts':dict(counts),'active':dict(active),'missing':dict(missing),'alternative_dates':dict(alt),'cad':dict(cadconf),'description':dict(namepat),'description_ean_candidates':dict(candidates),'item_ean_candidates_top':nets.most_common(12),'unowned_ean_top':unmatched.most_common(15),'cad_alias_without_context':dict(no_context),'history_date_range':[min(x for x in allhdates if x),max(allhdates)]},ensure_ascii=False))
          PY
