name: QA 27-11 - History como fato da entrada
on:
  push:
    branches: ['qa/skol-20261127']
    paths: ['.github/workflows/qa_skol_20261127.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconciliar todos os SKUs
        run: |
          python - <<'PY'
          import csv,io,zipfile,re,unicodedata,collections,json,decimal,datetime
          D=decimal.Decimal
          import functools
          @functools.lru_cache(maxsize=250000)
          def n(x):
              s=unicodedata.normalize('NFKC',str(x or '')).strip().upper()
              s=re.sub(r'[\s\u200b\ufeff]+','',s)
              if re.fullmatch(r'\d+(\.0+)?',s): return str(int(s.split('.')[0]))
              return s
          def hdr(x):
              return re.sub(r'[^a-z0-9]','',unicodedata.normalize('NFKD',x).encode('ascii','ignore').decode().lower())
          @functools.lru_cache(maxsize=20000)
          def day(x):
              s=str(x or '').strip()
              for fmt in ('%d/%m/%Y','%Y-%m-%d'):
                  try:
                      d=datetime.datetime.strptime(s[:10],fmt).date()
                      return d.isoformat() if d.year>1900 else ''
                  except ValueError: pass
              return ''
          @functools.lru_cache(maxsize=100000)
          def q(x):
              s=str(x or '').strip()
              if not s:return D(0)
              if ',' in s:s=s.replace('.','').replace(',','.')
              try:return D(s)
              except decimal.InvalidOperation:return None
          def rows(path):
              with zipfile.ZipFile(path) as z:
                  names=[i for i in z.namelist() if i.lower().endswith('.csv')]
                  assert len(names)==1, names
                  raw=z.read(names[0]).rstrip(b'\0')
              try: txt=raw.decode('utf-8-sig')
              except UnicodeDecodeError: txt=raw.decode('cp1252')
              r=csv.DictReader(io.StringIO(txt),delimiter=';')
              print('SCHEMA',path,json.dumps(r.fieldnames,ensure_ascii=False))
              return r
          def find(r,*aliases):
              return next((r[k] for k in aliases if k in r),'')
          def orderrow(r):
              return {'p':n(find(r,'Nº Pedido ERP','Número Pedido ERP')),'client':n(find(r,'Cliente EG')),'sku':n(find(r,'SKU EG')),'code':n(find(r,'Código Produto Cliente')),'ean':n(find(r,'EAN')),'date':day(find(r,'Data Captação ECC','Data Captação')),'valid':day(find(r,'Data de Vencimento','Data Vencimento')),'cnpj':n(find(r,'CNPJ Cliente','CNPJ','CNPJ do Cliente')),'created':day(find(r,'Data de Criação')),'original_valid':day(find(r,'Data de Vencimento Original')),'item':n(find(r,'Número do Item')),'net':n(find(r,'Nome Rede')),'origin':n(find(r,'Origem')),'realoc':n(find(r,'Tipo de realocação')),'realoc_qty':q(find(r,'Qtd. Realocada')),'order_id':n(find(r,'Nº Pedido Ambev')),'sap':n(find(r,'SKU SAP')),'desc':n(find(r,'Descrição Produto Cliente')),'bees':n(find(r,'Nº Pedido Bees AS')),'status':n(find(r,'Status')),'unit':n(find(r,'Unidade')),'original':q(find(r,'Qtd. Original')) if str(find(r,'Qtd. Original') or '').strip() else None,'mode':n(find(r,'Modo')),'channel':n(find(r,'Tipo Pedido')),'qty':[q(find(r,k)) for k in ('Qtd. Atualizada','Qtd. Carro com remessa','Qtd. Carro sem remessa','Qtd. Faturada')]}
          def histrow(r):
              return {'p':n(find(r,'Nº Pedido ERP','Número Pedido ERP')),'code':n(find(r,'Código Produto Cliente')),'ean':n(find(r,'EAN')),'date':day(find(r,'Data de Criação','Data Criação')),'valid':day(find(r,'Data de Vencimento','Data Vencimento')),'cnpj':n(find(r,'CNPJ Cliente','CNPJ','CNPJ do Cliente')),'desc':n(find(r,'Descrição Produto Cliente')),'bees':n(find(r,'Nº Pedido Bees AS')),'item':n(find(r,'Número do Item','Nº Item','Item')),'qty':q(find(r,'Qtd. Pedida'))}
          op='2026.11.27_10.22 ExportReportOrderItem ultimo.zip'
          hp='2026.11.27_10.24 ExportReportOrderHistory ultimo.zip'
          ref='2026-11-27'
          src=collections.Counter(); groups=collections.defaultdict(list); erps=set(); units=collections.Counter(); nets=set(); skus=set()
          for r in rows(op):
              src['order_rows']+=1
              o=orderrow(r); g=(o['p'],o['client'],o['sku'])
              if not all(g) or 'TESTE' in g[0]:
                  src['order_excluded']+=1;continue
              groups[g].append(o);erps.add(g[0]);units[o['unit']]+=1;nets.add(o['net']);skus.add(g[2])
          # History grain: original ERP, client CNPJ, client product (or EAN), creation and original validity.
          # The item number is not part of the entry key; equal repeated quantities are counted once.
          entries=collections.defaultdict(lambda:{'qty':set(),'ids':set(),'rows':0,'items':set(),'detail':set(),'descs':set(),'bees':set()})
          he=set(); hd=collections.Counter(); hr=0; missing_id=0; outside=set(); invalid_history=0; outside_rows=0; outside_erps=set(); all_cnpj=set()
          for r in rows(hp):
              hr+=1;h=histrow(r);p=h['p']
              if not p:invalid_history+=1;continue
              he.add(p);hd[h['date']]+=1
              prod=h['code'] or h['ean']
              if not prod:missing_id+=1;continue
              k=(p,h['cnpj'],prod,h['date'],h['valid'])
              if p not in erps:
                  outside.add(k);outside_rows+=1;outside_erps.add(p);continue
              z=entries[k];z['qty'].add(h['qty']);z['ids'].update({h['code'],h['ean']}-{''});z['rows']+=1;z['items'].add(h['item']);z['detail'].add((h['item'],h['qty'],h['code'],h['ean']));z['descs'].add(h['desc']);z['bees'].add(h['bees'])
          index=collections.defaultdict(set); rawindex=collections.defaultdict(set)
          for k,e in entries.items():
              for v in e['ids']:
                  index[(k[0],k[1],v)].add(k);rawindex[(k[0],v)].add(k)
          def validline(o):return bool(o['valid'] and o['valid']>=ref and 'CANCELAD' not in o['status'] and 'AGUARDANDOCANCELAMENTO' not in o['status'])
          # Prefer original creation/validity, then capture as secondary diagnostic. Current validity is not a key.
          # One qualifying journey line is sufficient; later lines do not need to re-match.
          bygroup={};owners=collections.defaultdict(set);relaxedown=collections.defaultdict(set)
          for g,oo in groups.items():
              p,c,sku=g;strict=set();cap=set();relaxed=set();raw=set();eg_sap=set(); matches=collections.defaultdict(list)
              for o in oo:
                  # compare identifiers in either named column; never rely on quantity to identify the entry
                  for v in {o['code'],o['ean']}-{''}:
                      raw.update(rawindex[(p,v)])
                      for k in index[(p,o['cnpj'],v)]:
                          if not o['cnpj']:continue
                          relaxed.add(k)
                          if k[3] and k[4] and o['created']==k[3] and o['original_valid']==k[4]:
                              strict.add(k);matches[k].append(o)
                          elif k[3] and k[4] and o['date']==k[3] and o['original_valid']==k[4]:
                              cap.add(k);matches[k].append(o)
                  for v in {o['sku'],o['sap']}-{''}:
                      for k in index[(p,o['cnpj'],v)]:
                          if o['cnpj'] and k[3] and k[4] and k[3] in {o['created'],o['date']} and k[4]==o['original_valid']:eg_sap.add(k)
              selected=strict|cap
              bygroup[g]=(strict,cap,relaxed,raw,eg_sap,matches)
              for k in selected:owners[k].add(g)
              for k in relaxed:relaxedown[k].add(g)
          # Test EG/SAP identities separately, and prevent reuse of existing History entries.
          skuowners=collections.defaultdict(set); sku_cands={}; sku_methods=collections.defaultdict(set)
          for g,oo in groups.items():
              p,c,sku=g;cs=set();methods=collections.defaultdict(set)
              for o in oo:
                  if not o['cnpj']:continue
                  for f in ('sku','sap'):
                      v=o[f]
                      if not v:continue
                      for k in index[(p,o['cnpj'],v)]:
                          if k[3] and k[4] and k[3] in {o['created'],o['date']} and k[4]==o['original_valid']:
                              cs.add(k);methods[k].add(f)
              sku_cands[g]=cs
              for k in cs:
                  skuowners[k].add(g)
                  sku_methods[(g,k)].update(methods[k])
          # First-pass assignments are identical to previous audit.
          assigned={};used=collections.defaultdict(set)
          for g,oo in groups.items():
              strict,cap,relaxed,raw,eg_sap,matches=bygroup[g]
              base={k for k in strict|cap if owners[k]=={g}}
              if len(base)==1:k=next(iter(base))
              elif not base:
                  cs=sku_cands[g];avail={k for k in cs if skuowners[k]=={g} and not (owners[k]-{g})}
                  k=next(iter(avail)) if len(cs)==1 and len(avail)==1 else None
              else:k=None
              if k is not None:assigned[g]=k;used[k].add(g)
          # Relax dates and CNPJ in separate diagnostic steps; no quantity used for identity.
          all_rel=collections.defaultdict(set); all_ro=collections.defaultdict(set); all_raw=collections.defaultdict(set)
          for g,oo in groups.items():
              p,c,sku=g
              for o in oo:
                  for v in {o['code'],o['ean'],o['sku'],o['sap']}-{''}:
                      all_raw[g].update(rawindex[(p,v)])
                      if o['cnpj']:all_rel[g].update(index[(p,o['cnpj'],v)])
              for k in all_rel[g]:all_ro[k].add(g)
          def distance(a,b):
              if not a or not b:return 9999
              return abs((datetime.date.fromisoformat(a)-datetime.date.fromisoformat(b)).days)
          def diffs(k,oo):
              return min((distance(k[3],d) for o in oo for d in (o['date'],o['created'])),default=9999), min((distance(k[4],o['original_valid']) for o in oo),default=9999)
          # Compare distance on a single journey line, rather than combining unrelated lines.
          def score(k,oo):
              return min((distance(k[4],o['original_valid']),min(distance(k[3],o['date']),distance(k[3],o['created']))) for o in oo)
          # Reverse reconciliation: evaluate each History key once, not every Order movement.
          # Quantity is never used to identify the corresponding group.
          erp_clients=collections.defaultdict(set); erp_groups=collections.defaultdict(set)
          for g,oo in groups.items():
              erp_groups[g[0]].add(g)
              for o in oo:
                  if o['cnpj']:erp_clients[(g[0],o['cnpj'])].add(g)
          matched=dict((k,next(iter(v))) for k,v in used.items() if len(v)==1)
          original_assigned=set(matched)
          method={k:'vinculo_original' for k in matched}
          # In the reverse direction a History key may be unique even if an Order group
          # has more than one source entry. Keep each independently keyed entry.
          for k in entries:
              if k in matched:continue
              cand=owners[k]|skuowners[k]
              if len(cand)==1:
                  g=next(iter(cand))
                  if all_ro[k]=={g}:
                      matched[k]=g;method[k]='entrada_exclusiva_datas'
          for k in entries:
              if k in matched:continue
              cand=all_ro[k]
              if len(cand)==1:
                  g=next(iter(cand))
                  # Without date equality require that both sides have a unique identity,
                  # unless original validity and creation/capture are close.
                  sc=score(k,groups[g]); rel=all_rel[g]
                  if len(rel)==1 or (sc[0]==0 and sc[1]<=3):
                      matched[k]=g;method[k]='identidade_exclusiva_datas_flex'
          # Determine whether additional entries attached to an already-linked group
          # may represent duplicated identifiers of one original event.
          reverse_groups=collections.defaultdict(list)
          for k,g in matched.items():reverse_groups[g].append(k)
          overlap=collections.Counter(); ambiguous=set()
          for g,kk in reverse_groups.items():
              if len(kk)<=1:continue
              overlap['multi_history_keys_same_order_group']+=1
              bydate=collections.defaultdict(list)
              for k in kk:bydate[k[3:5]].append(k)
              for vv in bydate.values():
                  if len(vv)<=1:continue
                  overlap['same_dates_multiple_product_keys']+=1
                  # Distinct codes could be aliases; same date/qty cannot establish independent entries.
                  for k in vv:
                      if k not in original_assigned:ambiguous.add(k)
          for k in ambiguous:
              matched.pop(k,None);method.pop(k,None)
          cnt=collections.Counter(); why=collections.Counter(); methods=collections.Counter(); byqty=collections.Counter(); volume=collections.defaultdict(lambda:D(0)); active_groups=set(); linked_groups=set(); detailed=collections.Counter(); histqtyissues=collections.Counter()
          for g,oo in groups.items():
              if any(validline(o) for o in oo):active_groups.add(g)
          for k,e in entries.items():
              cnt['history_common_erp_keys']+=1
              cscope=bool(erp_clients.get((k[0],k[1])))
              cnt['history_common_erp_cnpj_keys']+=cscope
              # Original History items: equal repeated snapshot of same item counts once;
              # distinct items with their own quantities count independently.
              iq=collections.defaultdict(set)
              for i,qv,code,ean in e['detail']:iq[i].add(qv)
              item_conflict=any(len(v)>1 or None in v for v in iq.values())
              hq=None if item_conflict else sum((next(iter(v)) for v in iq.values()),D(0))
              cnt['history_original_items_common_erp']+=len(iq)
              if k not in matched:
                  b='ERP e CNPJ nao coincidem' if not cscope else 'alias ou varias entradas na mesma data' if k in ambiguous else 'candidatos disputados' if len(all_ro[k])>1 else 'identidade existe, data divergente' if all_ro[k] else 'produto nao identificado na Order'
                  why[b]+=1
                  if hq is not None:volume['unlinked_history_native_qty']+=hq
                  continue
              g=matched[k];oo=groups[g];linked_groups.add(g);methods[method[k]]+=1
              cnt['history_linked_keys']+=1;cnt['history_linked_items']+=len(iq);cnt['history_linked_active_order_keys']+=g in active_groups
              cnt['history_linked_common_cnpj_keys']+=cscope
              if item_conflict:
                  histqtyissues['same_item_conflicting_qty']+=1
                  histqtyissues['active_same_item_conflicting_qty']+=g in active_groups
              else:
                  orig={o['original'] for o in oo if o['original'] is not None}
                  exact=all(next(iter(v)) in orig for v in iq.values())
                  byqty['each_history_item_qty_present_order']+=exact;byqty['history_qty_diagnostic_difference']+=not exact
                  byqty['distinct_history_items_multi']+=len(iq)>1
                  if g in active_groups:byqty['active_qty_diagnostic_difference']+=not exact
                  if all(o['unit']=='CX' for o in oo):
                      volume['linked_history_entry_CX']+=hq
                      if g in active_groups:volume['linked_history_active_entry_CX']+=hq
          cnt['history_keys_outside_order_erp']=len(outside)
          cnt['history_keys_total']=len(outside)+len(entries)
          cnt['history_rows_outside_order_erp']=outside_rows;cnt['history_distinct_erps_outside_order']=len(outside_erps)
          cnt['history_rows_invalid_erp']=invalid_history;cnt['history_rows_missing_product']=missing_id
          cnt['order_groups']=len(groups);cnt['order_groups_linked']=len(linked_groups);cnt['order_active_groups']=len(active_groups);cnt['order_active_groups_linked']=len(active_groups&linked_groups)
          cnt['order_groups_without_history']=len(groups)-len(linked_groups);cnt['order_active_groups_without_history']=len(active_groups-linked_groups)
          print('QA_REVERSE',json.dumps({'counts':dict(cnt),'unlinked_common_erp':dict(why),'methods':dict(methods),'quantity_checks':dict(byqty),'history_item_conflicts':dict(histqtyissues),'multiple_entry_diagnostics':dict(overlap),'additional_aliases_deferred':len(ambiguous),'volumes':{k:str(v) for k,v in volume.items()}},ensure_ascii=False))
