name: QA 27-11 - chave unica de entrada e jornada
on:
  push:
    branches: ['qa/skol-20261127']
    paths: ['.github/workflows/qa_skol_20261127.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconciliar todos os SKUs
        run: |
          python - <<'PY'
          import csv,io,zipfile,re,unicodedata,collections,json,decimal,datetime
          D=decimal.Decimal
          import functools
          @functools.lru_cache(maxsize=250000)
          def n(x):
              s=unicodedata.normalize('NFKC',str(x or '')).strip().upper()
              s=re.sub(r'[\s\u200b\ufeff]+','',s)
              if re.fullmatch(r'\d+(\.0+)?',s): return str(int(s.split('.')[0]))
              return s
          def hdr(x):
              return re.sub(r'[^a-z0-9]','',unicodedata.normalize('NFKD',x).encode('ascii','ignore').decode().lower())
          @functools.lru_cache(maxsize=20000)
          def day(x):
              s=str(x or '').strip()
              for fmt in ('%d/%m/%Y','%Y-%m-%d'):
                  try:
                      d=datetime.datetime.strptime(s[:10],fmt).date()
                      return d.isoformat() if d.year>1900 else ''
                  except ValueError: pass
              return ''
          @functools.lru_cache(maxsize=100000)
          def q(x):
              s=str(x or '').strip()
              if not s:return D(0)
              if ',' in s:s=s.replace('.','').replace(',','.')
              try:return D(s)
              except decimal.InvalidOperation:return None
          def rows(path):
              with zipfile.ZipFile(path) as z:
                  names=[i for i in z.namelist() if i.lower().endswith('.csv')]
                  assert len(names)==1, names
                  raw=z.read(names[0]).rstrip(b'\0')
              try: txt=raw.decode('utf-8-sig')
              except UnicodeDecodeError: txt=raw.decode('cp1252')
              r=csv.DictReader(io.StringIO(txt),delimiter=';')
              print('SCHEMA',path,json.dumps(r.fieldnames,ensure_ascii=False))
              return r
          def find(r,*aliases):
              return next((r[k] for k in aliases if k in r),'')
          def orderrow(r):
              return {'p':n(find(r,'Nº Pedido ERP','Número Pedido ERP')),'client':n(find(r,'Cliente EG')),'sku':n(find(r,'SKU EG')),'code':n(find(r,'Código Produto Cliente')),'ean':n(find(r,'EAN')),'date':day(find(r,'Data Captação ECC','Data Captação')),'valid':day(find(r,'Data de Vencimento','Data Vencimento')),'cnpj':n(find(r,'CNPJ Cliente','CNPJ','CNPJ do Cliente')),'created':day(find(r,'Data de Criação')),'original_valid':day(find(r,'Data de Vencimento Original')),'item':n(find(r,'Número do Item')),'net':n(find(r,'Nome Rede')),'origin':n(find(r,'Origem')),'realoc':n(find(r,'Tipo de realocação')),'realoc_qty':q(find(r,'Qtd. Realocada')),'order_id':n(find(r,'Nº Pedido Ambev')),'sap':n(find(r,'SKU SAP')),'desc':n(find(r,'Descrição Produto Cliente')),'bees':n(find(r,'Nº Pedido Bees AS')),'status':n(find(r,'Status')),'unit':n(find(r,'Unidade')),'original':q(find(r,'Qtd. Original')) if str(find(r,'Qtd. Original') or '').strip() else None,'mode':n(find(r,'Modo')),'channel':n(find(r,'Tipo Pedido')),'qty':[q(find(r,k)) for k in ('Qtd. Atualizada','Qtd. Carro com remessa','Qtd. Carro sem remessa','Qtd. Faturada')]}
          def histrow(r):
              return {'p':n(find(r,'Nº Pedido ERP','Número Pedido ERP')),'code':n(find(r,'Código Produto Cliente')),'ean':n(find(r,'EAN')),'date':day(find(r,'Data de Criação','Data Criação')),'valid':day(find(r,'Data de Vencimento','Data Vencimento')),'cnpj':n(find(r,'CNPJ Cliente','CNPJ','CNPJ do Cliente')),'desc':n(find(r,'Descrição Produto Cliente')),'bees':n(find(r,'Nº Pedido Bees AS')),'item':n(find(r,'Número do Item','Nº Item','Item')),'qty':q(find(r,'Qtd. Pedida'))}
          op='2026.11.27_10.22 ExportReportOrderItem ultimo.zip'
          hp='2026.11.27_10.24 ExportReportOrderHistory ultimo.zip'
          ref='2026-11-27'
          src=collections.Counter(); groups=collections.defaultdict(list); erps=set(); units=collections.Counter(); nets=set(); skus=set()
          for r in rows(op):
              src['order_rows']+=1
              o=orderrow(r); g=(o['p'],o['client'],o['sku'])
              if not all(g) or 'TESTE' in g[0]:
                  src['order_excluded']+=1;continue
              groups[g].append(o);erps.add(g[0]);units[o['unit']]+=1;nets.add(o['net']);skus.add(g[2])
          # History grain: original ERP, client CNPJ, client product (or EAN), creation and original validity.
          # The item number is not part of the entry key; equal repeated quantities are counted once.
          entries=collections.defaultdict(lambda:{'qty':set(),'ids':set(),'rows':0,'items':set()})
          he=set(); hd=collections.Counter(); hr=0; missing_id=0
          for r in rows(hp):
              hr+=1;h=histrow(r);p=h['p']
              if not p:continue
              he.add(p);hd[h['date']]+=1
              if p not in erps:continue
              prod=h['code'] or h['ean']
              if not prod:missing_id+=1;continue
              k=(p,h['cnpj'],prod,h['date'],h['valid'])
              z=entries[k];z['qty'].add(h['qty']);z['ids'].update({h['code'],h['ean']}-{''});z['rows']+=1;z['items'].add(h['item'])
          index=collections.defaultdict(set); rawindex=collections.defaultdict(set)
          for k,e in entries.items():
              for v in e['ids']:
                  index[(k[0],k[1],v)].add(k);rawindex[(k[0],v)].add(k)
          def validline(o):return bool(o['valid'] and o['valid']>=ref and 'CANCELAD' not in o['status'] and 'AGUARDANDOCANCELAMENTO' not in o['status'])
          # Prefer original creation/validity, then capture as secondary diagnostic. Current validity is not a key.
          # One qualifying journey line is sufficient; later lines do not need to re-match.
          bygroup={};owners=collections.defaultdict(set);relaxedown=collections.defaultdict(set)
          for g,oo in groups.items():
              p,c,sku=g;strict=set();cap=set();relaxed=set();raw=set();eg_sap=set(); matches=collections.defaultdict(list)
              for o in oo:
                  # compare identifiers in either named column; never rely on quantity to identify the entry
                  for v in {o['code'],o['ean']}-{''}:
                      raw.update(rawindex[(p,v)])
                      for k in index[(p,o['cnpj'],v)]:
                          if not o['cnpj']:continue
                          relaxed.add(k)
                          if k[3] and k[4] and o['created']==k[3] and o['original_valid']==k[4]:
                              strict.add(k);matches[k].append(o)
                          elif k[3] and k[4] and o['date']==k[3] and o['original_valid']==k[4]:
                              cap.add(k);matches[k].append(o)
                  for v in {o['sku'],o['sap']}-{''}:
                      for k in index[(p,o['cnpj'],v)]:
                          if o['cnpj'] and k[3] and k[4] and k[3] in {o['created'],o['date']} and k[4]==o['original_valid']:eg_sap.add(k)
              selected=strict|cap
              bygroup[g]=(strict,cap,relaxed,raw,eg_sap,matches)
              for k in selected:owners[k].add(g)
              for k in relaxed:relaxedown[k].add(g)
          res=collections.defaultdict(collections.Counter); histvol=collections.defaultdict(lambda:collections.defaultdict(lambda:D(0))); block=collections.defaultdict(collections.Counter); sample=collections.Counter()
          for g,oo in groups.items():
              p,c,sku=g;strict,cap,relaxed,raw,eg_sap,matches=bygroup[g]
              sel=strict|cap;exclusive={k for k in sel if owners[k]=={g}}
              # Candidate with unique ERP+CNPJ+product, regardless dates, is reported separately.
              unique_relax=next(iter(relaxed)) if len(relaxed)==1 and relaxedown[next(iter(relaxed))]=={g} else None
              live=any(validline(o) for o in oo)
              livep=sum((o['qty'][0]-sum(o['qty'][1:]) for o in oo if validline(o) and None not in o['qty']),D(0))
              orig={o['original'] for o in oo if o['original'] is not None}
              for lab in ['all']+(['active'] if live else [])+(['active_pending'] if livep>0 else []):
                  z=res[lab];z['order_groups']+=1;z['order_rows']+=len(oo);z['multirow_groups']+=len(oo)>1
                  z['identity_exists']+=bool(sel);z['exclusive_entry_exists']+=bool(exclusive);z['exclusive_multirow_groups']+=bool(exclusive) and len(oo)>1;z['multiple_independent_entry_keys']+=len(exclusive)>1
                  z['history_entry_keys']+=len(exclusive);z['strict_creation_entry_keys']+=len(exclusive&strict);z['capture_fallback_entry_keys']+=len(exclusive-strict)
                  z['history_rows_represented']+=sum(entries[k]['rows'] for k in exclusive)
                  z['history_repeated_entry_keys']+=sum(entries[k]['rows']>1 for k in exclusive)
                  z['history_repeated_entry_keys_consistent']+=sum(entries[k]['rows']>1 and len(entries[k]['qty'])==1 for k in exclusive)
                  qtykeys=[k for k in exclusive if len(entries[k]['qty'])==1 and None not in entries[k]['qty']]
                  z['entry_qty_unique']+=len(qtykeys);z['entry_qty_conflicting']+=len(exclusive)-len(qtykeys)
                  z['group_has_entry_qty']+=bool(qtykeys)
                  eqkeys=[]
                  for k in qtykeys:
                      hq=next(iter(entries[k]['qty']))
                      # All journey originals may differ, but any single matching original proves presence.
                      if hq in orig:eqkeys.append(k)
                      z['entry_qty_equals_some_order_original']+=hq in orig
                      z['entry_qty_equals_original_matching_date_row']+=any(o['original']==hq for o in matches[k])
                      z['entry_qty_equals_order_unique_original']+=orig=={hq}
                      z['entry_qty_no_order_original_equal']+=hq not in orig
                      if {o['unit'] for o in oo}=={'CX'}:histvol[lab]['entry_CX_once']+=hq
                  z['group_has_equal_entry']+=bool(eqkeys)
                  z['group_all_entry_keys_equal']+=bool(qtykeys) and len(qtykeys)==len(exclusive)==len(eqkeys)
                  if not exclusive:
                      b='erp_missing' if p not in he else 'candidate_shared_between_groups' if sel else 'date_conflict_same_product_cnpj' if relaxed else 'cnpj_conflict_same_product' if raw else 'product_no_identifier_match'
                      block[lab][b]+=1
                      z['diagnostic_relaxed_unique']+=unique_relax is not None
                      z['diagnostic_relaxed_unique_equal']+=unique_relax is not None and len(entries[unique_relax]['qty'])==1 and next(iter(entries[unique_relax]['qty'])) in orig
                      z['diagnostic_sku_code_candidate']+=bool(eg_sap)
                  if len(oo)>1 and exclusive:
                      z['matched_one_or_some_not_all_rows']+=any(not any(o in matches[k] for k in exclusive) for o in oo)
          print('QA_ENTRY_GRAIN',json.dumps({'source':{'order_rows':src['order_rows'],'order_excluded':src['order_excluded'],'history_rows':hr,'history_entry_keys_in_common_erps':len(entries),'history_duplicate_rows_removed_at_entry_grain':sum(e['rows']-1 for e in entries.values()),'history_keys_multiple_quantity':sum(len(e['qty'])>1 for e in entries.values()),'history_keys_missing_product':missing_id},'counts':{k:dict(v) for k,v in res.items()},'unmatched':{k:dict(v) for k,v in block.items()},'volumes':{k:{a:str(b) for a,b in v.items()} for k,v in histvol.items()}},ensure_ascii=False))
          PY
