name: QA SKOL 27-11 - exclusividade e origem
on:
  push:
    branches: ['qa/skol-20261127']
    paths: ['.github/workflows/qa_skol_20261127.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install openpyxl
