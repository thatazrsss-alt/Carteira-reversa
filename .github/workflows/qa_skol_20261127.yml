                  hh_item=[h for h in hh_c if any(o['item'] and o['item']==h['item'] for o in oo)]
                  hh_unowned=[h for h in hh_ctx if not owners(p,h)]
                  absent_stats['cnpj_found']+=bool(hh_c);absent_stats['context_found']+=bool(hh_ctx)
                  absent_stats['all_context_items_claimed']+=bool(hh_ctx) and not hh_unowned
                  absent_stats['item_number_match_ignoring_dates']+=bool(hh_item)
                  absent_stats['item_number_matches_other_sku']+=any(owners(p,h)-{(c,'360248')} for h in hh_item)
                  absent_stats['all_cancelled']+=all('CANCELAD' in o['status'] for o in oo)
                  absent_stats['has_order_original_gt0']+=any(o['original'] is not None and o['original']>0 for o in oo)
