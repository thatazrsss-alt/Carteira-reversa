          print('QA_EXCLUSIVITY',json.dumps({'owners':dict(ownstats),'active_owners':dict(active_own),'alternative_qty_checks':dict(qty_stats),'missing_product':dict(absent_stats),'missing_active':dict(absent_active),'item_number_history_eans_top':code_context.most_common(10),'missing_product_order_eans':dict(order_eans)},ensure_ascii=False))
          counts=collections.Counter(); missing=collections.Counter(); alt=collections.Counter(); candidates=collections.Counter(); cadconf=collections.Counter(); unmatched=collections.Counter(); no_context=collections.Counter(); namepat=collections.Counter(); nets=collections.Counter(); active=collections.Counter()
          for (p,c),oo in group.items():
