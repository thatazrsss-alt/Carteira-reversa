name: QA SKOL 27-11
on:
  push:
    branches: ['qa/skol-20261127']
    paths: ['.github/workflows/qa_skol_20261127.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Reconciliar SKU 360248
        run: |
          python - <<'PY'
          import csv,io,zipfile,re,unicodedata,collections,json,decimal,datetime
          D=decimal.Decimal
          def n(x):
              s=unicodedata.normalize('NFKC',str(x or '')).strip().upper()
              s=re.sub(r'[\s\u200b\ufeff]+','',s)
              if re.fullmatch(r'\d+(\.0+)?',s): return str(int(s.split('.')[0]))
              return s
          def hdr(x):
              return re.sub(r'[^a-z0-9]','',unicodedata.normalize('NFKD',x).encode('ascii','ignore').decode().lower())
          def day(x):
              s=str(x or '').strip()
              for fmt in ('%d/%m/%Y','%Y-%m-%d'):
                  try: return datetime.datetime.strptime(s[:10],fmt).date().isoformat()
                  except ValueError: pass
              return ''
          def q(x):
              s=str(x or '').strip()
              if not s:return D(0)
              if ',' in s:s=s.replace('.','').replace(',','.')
              try:return D(s)
              except decimal.InvalidOperation:return None
          def rows(path):
              with zipfile.ZipFile(path) as z:
                  names=[i for i in z.namelist() if i.lower().endswith('.csv')]
                  assert len(names)==1, names
                  raw=z.read(names[0]).rstrip(b'\0')
              try: txt=raw.decode('utf-8-sig')
              except UnicodeDecodeError: txt=raw.decode('cp1252')
              r=csv.DictReader(io.StringIO(txt),delimiter=';')
              print('SCHEMA',path,json.dumps(r.fieldnames,ensure_ascii=False))
              return r
          def find(r,*aliases):
              m={hdr(k):v for k,v in r.items() if k is not None}
              return next((m[hdr(k)] for k in aliases if hdr(k) in m),'')
          def orderrow(r):
              return {'p':n(find(r,'Nº Pedido ERP','Número Pedido ERP')),'client':n(find(r,'Cliente EG')),'sku':n(find(r,'SKU EG')),'code':n(find(r,'Código Produto Cliente')),'ean':n(find(r,'EAN')),'date':day(find(r,'Data Captação ECC','Data Captação')),'valid':day(find(r,'Data de Vencimento','Data Vencimento')),'cnpj':n(find(r,'CNPJ Cliente','CNPJ','CNPJ do Cliente')),'status':n(find(r,'Status')),'unit':n(find(r,'Unidade')),'qty':[q(find(r,k)) for k in ('Qtd. Atualizada','Qtd. Carro com remessa','Qtd. Carro sem remessa','Qtd. Faturada')]}
          def histrow(r):
              return {'p':n(find(r,'Nº Pedido ERP','Número Pedido ERP')),'code':n(find(r,'Código Produto Cliente')),'ean':n(find(r,'EAN')),'date':day(find(r,'Data de Criação','Data Criação')),'valid':day(find(r,'Data de Vencimento','Data Vencimento')),'cnpj':n(find(r,'CNPJ Cliente','CNPJ','CNPJ do Cliente')),'item':n(find(r,'Número do Item','Nº Item','Item')),'qty':q(find(r,'Qtd. Pedida'))}
          target={'842558010202','842558010215'}
          order=collections.defaultdict(list); allsku=collections.Counter(); other=collections.Counter()
          for r in rows('2026.11.27_10.22 ExportReportOrderItem ultimo.zip'):
              # Read only rows relevant to audit.
              sku=n(r.get('SKU EG')); p=n(r.get('Nº Pedido ERP'))
              if sku=='360248':
                  o=orderrow(r);order[p].append(o);allsku[o['code']]+=1
              if p in target and sku!='360248':other[(p,sku)]+=1
          hist=collections.defaultdict(list)
          for r in rows('2026.11.27_10.24 ExportReportOrderHistory ultimo.zip'):
              p=n(r.get('Nº Pedido ERP'))
              if p in order or p in target:hist[p].append(histrow(r))
          def compatible(o,h):
              return all(not(o[k] and h[k]) or o[k]==h[k] for k in ('date','valid','cnpj'))
          groups=collections.defaultdict(list)
          for p,oo in order.items():
              for o in oo:groups[(p,o['client'])].append(o)
          counts=collections.Counter();results=[]
          for (p,client),oo in groups.items():
              hh=hist[p]; C=[h for h in hh if any(o['code'] and o['code']==h['code'] for o in oo)]
              E=[h for h in hh if any(o['ean'] and o['ean']==h['ean'] for o in oo)]
              B=[h for h in hh if any(compatible(o,h) and ((o['code'] and o['code']==h['code']) or (o['ean'] and o['ean']==h['ean'])) for o in oo)]
              # Collapse identical snapshots, never sum repeated original quantities automatically.
              unique={(h['item'],h['code'],h['ean'],h['date'],h['valid'],h['cnpj'],h['qty']) for h in B}
              counts['groups']+=1;counts['erp_found']+=bool(hh);counts['code_match']+=bool(C);counts['ean_match']+=bool(E);counts['context_match']+=bool(B);counts['one_distinct_history']+=len(unique)==1
              if p in target:
                  moves=[sum((o['qty'][i] for o in oo if o['qty'][i] is not None),D(0)) for i in range(4)]
                  rec={'erp':p,'client':client,'order_rows':len(oo),'history_rows_erp':len(hh),'code_matches':len(C),'ean_matches':len(E),'context_matches':len(B),'unique_history':len(unique),'order_codes':sorted({o['code'] for o in oo}),'order_eans':sorted({o['ean'] for o in oo}),'history_codes':sorted({h['code'] for h in hh}),'history_eans':sorted({h['ean'] for h in hh}),'matched_history_qty':sorted({str(h['qty']) for h in B}),'date_match':any(o['date'] and o['date']==h['date'] for o in oo for h in B),'cnpj_comparable':any(o['cnpj'] and h['cnpj'] for o in oo for h in B),'units':sorted({o['unit'] for o in oo}),'statuses':sorted({o['status'] for o in oo}),'moves':list(map(str,moves)),'other_sku_count':sum(v for (pp,ss),v in other.items() if pp==p)}
                  results.append(rec)
          print('QA_RESULT',json.dumps({'counts':dict(counts),'sku_rows':sum(allsku.values()),'target':results,'target_missing_order':sorted(target-set(order))},ensure_ascii=False))
          PY
