name: QA SKOL 27-11 - original unica e pendente por linha
on:
  push:
    branches: ['qa/skol-20261127']
    paths: ['.github/workflows/qa_skol_20261127.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Reconciliar SKU 360248
        run: |
          python - <<'PY'
          import csv,io,zipfile,re,unicodedata,collections,json,decimal,datetime
          D=decimal.Decimal
          def n(x):
              s=unicodedata.normalize('NFKC',str(x or '')).strip().upper()
              s=re.sub(r'[\s\u200b\ufeff]+','',s)
              if re.fullmatch(r'\d+(\.0+)?',s): return str(int(s.split('.')[0]))
              return s
          def hdr(x):
              return re.sub(r'[^a-z0-9]','',unicodedata.normalize('NFKD',x).encode('ascii','ignore').decode().lower())
          def day(x):
              s=str(x or '').strip()
              for fmt in ('%d/%m/%Y','%Y-%m-%d'):
                  try: return datetime.datetime.strptime(s[:10],fmt).date().isoformat()
                  except ValueError: pass
              return ''
          def q(x):
              s=str(x or '').strip()
              if not s:return D(0)
              if ',' in s:s=s.replace('.','').replace(',','.')
              try:return D(s)
              except decimal.InvalidOperation:return None
          def rows(path):
              with zipfile.ZipFile(path) as z:
                  names=[i for i in z.namelist() if i.lower().endswith('.csv')]
                  assert len(names)==1, names
                  raw=z.read(names[0]).rstrip(b'\0')
              try: txt=raw.decode('utf-8-sig')
              except UnicodeDecodeError: txt=raw.decode('cp1252')
              r=csv.DictReader(io.StringIO(txt),delimiter=';')
              print('SCHEMA',path,json.dumps(r.fieldnames,ensure_ascii=False))
              return r
          def find(r,*aliases):
              m={hdr(k):v for k,v in r.items() if k is not None}
              return next((m[hdr(k)] for k in aliases if hdr(k) in m),'')
          def orderrow(r):
              return {'p':n(find(r,'Nº Pedido ERP','Número Pedido ERP')),'client':n(find(r,'Cliente EG')),'sku':n(find(r,'SKU EG')),'code':n(find(r,'Código Produto Cliente')),'ean':n(find(r,'EAN')),'date':day(find(r,'Data Captação ECC','Data Captação')),'valid':day(find(r,'Data de Vencimento','Data Vencimento')),'cnpj':n(find(r,'CNPJ Cliente','CNPJ','CNPJ do Cliente')),'created':day(find(r,'Data de Criação')),'original_valid':day(find(r,'Data de Vencimento Original')),'item':n(find(r,'Número do Item')),'net':n(find(r,'Nome Rede')),'status':n(find(r,'Status')),'unit':n(find(r,'Unidade')),'original':q(find(r,'Qtd. Original')) if str(find(r,'Qtd. Original') or '').strip() else None,'mode':n(find(r,'Modo')),'qty':[q(find(r,k)) for k in ('Qtd. Atualizada','Qtd. Carro com remessa','Qtd. Carro sem remessa','Qtd. Faturada')]}
          def histrow(r):
              return {'p':n(find(r,'Nº Pedido ERP','Número Pedido ERP')),'code':n(find(r,'Código Produto Cliente')),'ean':n(find(r,'EAN')),'date':day(find(r,'Data de Criação','Data Criação')),'valid':day(find(r,'Data de Vencimento','Data Vencimento')),'cnpj':n(find(r,'CNPJ Cliente','CNPJ','CNPJ do Cliente')),'desc':n(find(r,'Descrição Produto Cliente')),'item':n(find(r,'Número do Item','Nº Item','Item')),'qty':q(find(r,'Qtd. Pedida'))}
          op='2026.11.27_10.22 ExportReportOrderItem ultimo.zip'
          hp='2026.11.27_10.24 ExportReportOrderHistory ultimo.zip'
          groups=collections.defaultdict(list)
          for r in rows(op):
              if n(r.get('SKU EG'))=='360248':
                  o=orderrow(r);groups[(o['p'],o['client'],o['sku'])].append(o)
          erps={g[0] for g in groups}
          allorder=collections.defaultdict(list)
          for r in rows(op):
              p=n(r.get('Nº Pedido ERP'))
              if p in erps:allorder[p].append(orderrow(r))
          hist=collections.defaultdict(list)
          for r in rows(hp):
              p=n(r.get('Nº Pedido ERP'))
              if p in erps:hist[p].append(histrow(r))
          def match(o,h):
              return (o['ean'] and o['ean']==h['ean']) or (o['code'] and o['code']==h['code'])
          def comp(o,h,alt=False):
              return (not(o['cnpj'] and h['cnpj']) or o['cnpj']==h['cnpj']) and (not(o['date'] and h['date']) or h['date']==o['date'] or (alt and h['date']==o['created'])) and (not(o['valid'] and h['valid']) or h['valid']==o['valid'] or (alt and h['valid']==o['original_valid']))
          def uq(hh):
              return {(h['item'],h['code'],h['ean'],h['date'],h['valid'],h['cnpj'],h['qty']) for h in hh}
          counters=collections.defaultdict(collections.Counter);totals=collections.defaultdict(lambda:collections.defaultdict(lambda:D(0))); patterns=collections.defaultdict(collections.Counter)
          for (p,c,sku),oo in groups.items():
              hh=hist[p]; direct=[h for h in hh if any(match(o,h) and comp(o,h) for o in oo)]; alt=[h for h in hh if any(match(o,h) and comp(o,h,True) for o in oo)]
              candidates=direct if len(uq(direct))==1 else alt if len(uq(alt))==1 else []
              h=candidates[0] if candidates else None
              if h:
                  owners={(o['client'],o['sku']) for o in allorder[p] if comp(o,h,True) and bool(({o['ean'],o['code']}-{''}) & ({h['ean'],h['code']}-{''}))}
                  if owners!={(c,sku)}:h=None
              bucket='history_matched' if h else 'history_missing_erp' if not hh else 'history_date_unresolved' if any(match(o,x) for o in oo for x in hh) else 'history_missing_product'
              active=any(o['valid']>='2026-11-27' and 'CANCELAD' not in o['status'] for o in oo)
              orig={o['original'] for o in oo if o['original'] is not None}
              positive={x for x in orig if x>0}
              orig_unique=next(iter(orig)) if len(orig)==1 and all(o['original'] is not None for o in oo) else None
              valid_qty=all(None not in o['qty'] for o in oo)
              unit_cx=all(o['unit']=='CX' for o in oo)
              pend=sum((o['qty'][0]-sum(o['qty'][1:]) for o in oo),D(0)) if valid_qty else None
              pend_nc=sum((o['qty'][0]-sum(o['qty'][1:]) for o in oo if 'CANCELAD' not in o['status']),D(0)) if valid_qty else None
              delivered=sum((o['qty'][3] for o in oo),D(0)) if valid_qty else None
              marked=sum((o['qty'][1] for o in oo),D(0)) if valid_qty else None
              sem=sum((o['qty'][2] for o in oo),D(0)) if valid_qty else None
              updated=sum((o['qty'][0] for o in oo),D(0)) if valid_qty else None
              for label in [bucket]+([bucket+'_active'] if active else []):
                  z=counters[label];t=totals[label];z['keys']+=1;z['rows']+=len(oo);z['multirow']+=len(oo)>1;z['all_cancelled']+=all('CANCELAD' in o['status'] for o in oo);z['mixed_cancelled']+=any('CANCELAD' in o['status'] for o in oo) and not all('CANCELAD' in o['status'] for o in oo)
                  z['orig_unique_positive']+=orig_unique is not None and orig_unique>0;z['orig_unique_zero']+=orig_unique==0;z['orig_multiple_distinct']+=len(orig)>1;z['orig_blank_or_invalid_row']+=any(o['original'] is None for o in oo);z['orig_one_positive_plus_zero_or_blank']+=len(positive)==1 and orig_unique is None
                  z['all_CX']+=unit_cx;z['invalid_movement']+=not valid_qty
                  if h and h['qty'] is not None and unit_cx:
                      z['history_quantity_present']+=1
                      z['original_unique_equal_history']+=orig_unique==h['qty'];z['original_unique_diff_history']+=orig_unique is not None and orig_unique!=h['qty'];z['history_among_original_values']+=h['qty'] in orig
                      z['original_positive_unique_equal_history']+=len(positive)==1 and h['qty'] in positive
                      z['original_sum_equal_history']+=all(o['original'] is not None for o in oo) and sum((o['original'] for o in oo if o['original'] is not None),D(0))==h['qty']
                      z['multirow_unique_equal_history']+=len(oo)>1 and orig_unique==h['qty'];z['multirow_unique_diff_history']+=len(oo)>1 and orig_unique is not None and orig_unique!=h['qty']
                      z['multirow_original_multiple']+=len(oo)>1 and len(orig)>1
                      if orig_unique is not None and orig_unique!=h['qty']:patterns[label]['original maior' if orig_unique>h['qty'] else 'original menor']+=1
                      t['history_entry_CX']+=h['qty']
                  if unit_cx and valid_qty:
                      z['pending_positive']+=pend>0;z['pending_negative']+=pend<0;z['pending_non_cancelled_diff']+=pend!=pend_nc;z['negative_row']+=any(o['qty'][0]-sum(o['qty'][1:])<0 for o in oo)
                      z['positive_pending_and_orig_unique']+=pend>0 and orig_unique is not None and orig_unique>0
                      if orig_unique is not None and orig_unique>0:
                          t['original_unique_CX']+=orig_unique;z['delivered_marked_gt_original']+=delivered+marked>orig_unique;z['all_movements_gt_original']+=delivered+marked+sem+pend>orig_unique;z['updated_gt_original']+=updated>orig_unique
                          z['original_equals_updated']+=orig_unique==updated
                      if h and h['qty'] is not None:
                          z['delivered_marked_gt_history']+=delivered+marked>h['qty']
                      for k,v in [('updated_CX',updated),('delivered_CX',delivered),('marked_CX',marked),('without_remessa_CX',sem),('pending_CX',pend),('pending_non_cancelled_CX',pend_nc)]:t[k]+=v
          print('QA_ORIGINAL',json.dumps({'groups':{k:dict(v) for k,v in counters.items()},'totals_CX':{k:{x:str(y) for x,y in v.items()} for k,v in totals.items()},'differences':{k:dict(v) for k,v in patterns.items()}},ensure_ascii=False))
          PY
