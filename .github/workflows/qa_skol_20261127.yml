name: QA 27-11 - OXXO itens e clientes CNPJ divergente
on:
  push:
    branches: ['qa/skol-20261127']
    paths: ['.github/workflows/qa_skol_20261127.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install openpyxl
      - name: Reconciliar todos os SKUs
        run: |
          python - <<'PY'
          import csv,io,zipfile,re,unicodedata,collections,json,decimal,datetime
          D=decimal.Decimal
          import functools
          @functools.lru_cache(maxsize=250000)
          def n(x):
              s=unicodedata.normalize('NFKC',str(x or '')).strip().upper()
              s=re.sub(r'[\s\u200b\ufeff]+','',s)
              if re.fullmatch(r'\d+(\.0+)?',s): return str(int(s.split('.')[0]))
              return s
          def hdr(x):
              return re.sub(r'[^a-z0-9]','',unicodedata.normalize('NFKD',x).encode('ascii','ignore').decode().lower())
          @functools.lru_cache(maxsize=20000)
          def day(x):
              s=str(x or '').strip()
              for fmt in ('%d/%m/%Y','%Y-%m-%d'):
                  try:
                      d=datetime.datetime.strptime(s[:10],fmt).date()
                      return d.isoformat() if d.year>1900 else ''
                  except ValueError: pass
              return ''
          @functools.lru_cache(maxsize=100000)
          def q(x):
              s=str(x or '').strip()
              if not s:return D(0)
              if ',' in s:s=s.replace('.','').replace(',','.')
              try:return D(s)
              except decimal.InvalidOperation:return None
          def rows(path):
              with zipfile.ZipFile(path) as z:
                  names=[i for i in z.namelist() if i.lower().endswith('.csv')]
                  assert len(names)==1, names
                  raw=z.read(names[0]).rstrip(b'\0')
              try: txt=raw.decode('utf-8-sig')
              except UnicodeDecodeError: txt=raw.decode('cp1252')
              r=csv.DictReader(io.StringIO(txt),delimiter=';')
              print('SCHEMA',path,json.dumps(r.fieldnames,ensure_ascii=False))
              return r
          def find(r,*aliases):
              return next((r[k] for k in aliases if k in r),'')
          def orderrow(r):
              return {'p':n(find(r,'Nº Pedido ERP','Número Pedido ERP')),'client':n(find(r,'Cliente EG')),'sku':n(find(r,'SKU EG')),'code':n(find(r,'Código Produto Cliente')),'ean':n(find(r,'EAN')),'date':day(find(r,'Data Captação ECC','Data Captação')),'valid':day(find(r,'Data de Vencimento','Data Vencimento')),'cnpj':n(find(r,'CNPJ Cliente','CNPJ','CNPJ do Cliente')),'created':day(find(r,'Data de Criação')),'original_valid':day(find(r,'Data de Vencimento Original')),'item':n(find(r,'Número do Item')),'net':n(find(r,'Nome Rede')),'origin':n(find(r,'Origem')),'realoc':n(find(r,'Tipo de realocação')),'realoc_qty':q(find(r,'Qtd. Realocada')),'order_id':n(find(r,'Nº Pedido Ambev')),'sap':n(find(r,'SKU SAP')),'sapdesc':n(find(r,'Descrição SKU SAP')),'sapdesc_raw':str(find(r,'Descrição SKU SAP') or '').strip(),'supplier':n(find(r,'CNPJ Fornecedor')),'desc':n(find(r,'Descrição Produto Cliente')),'descraw':str(find(r,'Descrição Produto Cliente') or '').strip(),'bees':n(find(r,'Nº Pedido Bees AS')),'cancelday':day(find(r,'Data de Cancelamento')),'cancelreason':str(find(r,'Motivo Cancelamento') or '').strip(),'status':n(find(r,'Status')),'unit':n(find(r,'Unidade')),'original':q(find(r,'Qtd. Original')) if str(find(r,'Qtd. Original') or '').strip() else None,'mode':n(find(r,'Modo')),'channel':n(find(r,'Tipo Pedido')),'qty':[q(find(r,k)) for k in ('Qtd. Atualizada','Qtd. Carro com remessa','Qtd. Carro sem remessa','Qtd. Faturada')]}
          def histrow(r):
              return {'p':n(find(r,'Nº Pedido ERP','Número Pedido ERP')),'code':n(find(r,'Código Produto Cliente')),'ean':n(find(r,'EAN')),'date':day(find(r,'Data de Criação','Data Criação')),'valid':day(find(r,'Data de Vencimento','Data Vencimento')),'cnpj':n(find(r,'CNPJ Cliente','CNPJ','CNPJ do Cliente')),'desc':n(find(r,'Descrição Produto Cliente')),'bees':n(find(r,'Nº Pedido Bees AS')),'supplier':n(find(r,'CNPJ Fornecedor')),'item':n(find(r,'Número do Item','Nº Item','Item')),'qty':q(find(r,'Qtd. Pedida'))}
          op='2026.11.27_10.22 ExportReportOrderItem ultimo.zip'
          hp='2026.11.27_10.24 ExportReportOrderHistory ultimo.zip'
          ref='2026-11-27'
          target_erps={'69610056','8952380','4508967432'}
          history=collections.defaultdict(list)
          def hdetail(r):
              h=histrow(r);return {'cnpj':h['cnpj'],'code':h['code'],'ean':h['ean'],'item':h['item'],'qty':str(h['qty']),'created':h['date'],'valid':h['valid'],'desc':find(r,'Descrição Produto Cliente'),'bees':h['bees']}
          for r in rows(hp):
              p=n(find(r,'Nº Pedido ERP'))
              if p in target_erps:history[p].append(hdetail(r))
          cnpj_targets={x['cnpj'] for p in ('8952380','4508967432') for x in history[p]}
          allorder=collections.defaultdict(list); clients=collections.defaultdict(collections.Counter)
          def clientinfo(r):
              return (n(find(r,'Cliente EG')),n(find(r,'Cliente SAP')),str(find(r,'Nome Cliente SAP')).strip(),str(find(r,'Nome Rede')).strip())
          def odetail(r):
              o=orderrow(r)
              return {'cnpj':o['cnpj'],'client_eg':o['client'],'client_sap':n(find(r,'Cliente SAP')),'client_name':find(r,'Nome Cliente SAP'),'network':find(r,'Nome Rede'),'eg':o['sku'],'sap':o['sap'],'ean':o['ean'],'code':o['code'],'desc':o['sapdesc_raw'],'item':o['item'],'am_bev':o['order_id'],'original':str(o['original']),'updated':str(o['qty'][0]),'marked':str(o['qty'][1]),'no_remessa':str(o['qty'][2]),'billed':str(o['qty'][3]),'created':o['created'],'capture':o['date'],'valid_orig':o['original_valid'],'valid_now':o['valid'],'status':o['status'],'cancel_date':o['cancelday'],'cancel_reason':o['cancelreason'],'origin':o['origin']}
          for r in rows(op):
              p=n(find(r,'Nº Pedido ERP'));c=n(find(r,'CNPJ Cliente'))
              if c in cnpj_targets:clients[c][clientinfo(r)]+=1
              if p in target_erps:allorder[p].append(odetail(r))
          # Details of both source product codes; retain individual original History lines.
          oxh=[h for h in history['69610056'] if h['code'] in {'4001952','4001651'}]
          oxids={v for h in oxh for v in (h['code'],h['ean']) if v}
          oxo=[o for o in allorder['69610056'] if oxids&{o['code'],o['ean'],o['eg'],o['sap']} or o['eg'] in {'129486','130617'}]
          # CAD EAN mapping (individual History identifiers plus candidate Order SKUs).
          import openpyxl
          wb=openpyxl.load_workbook('BASE_ESTOQUE 16.11.xlsx',read_only=True,data_only=True)
          ws=next(w for w in wb if hdr(w.title)=='cad')
          it=iter(ws.values); headers=[str(x or '') for x in next(it)]; names=[hdr(x) for x in headers]
          si=names.index('codprod');ei=[i for i,x in enumerate(names) if 'ean' in x];di=names.index('dscprodutosku');pi=names.index('embalagemsku')
          oxcad=[]
          for row in it:
              sku=n(row[si]);ids={n(row[i]) for i in ei if i<len(row)}-{''}
              if ids&oxids or sku in {o['eg'] for o in oxo}:
                  oxcad.append({'sku_eg':sku,'description':str(row[di]),'pack':str(row[pi]),'codes':{headers[i]:n(row[i]) for i in ei}})
          wb.close()
          # CNPJ cases: preserve exact customer and compare all original items, not just quantity.
          selected={'8952380':{'11668','214411','5033'},'4508967432':{'356170'}}
          cdetails={}
          for p,sk in selected.items():
              oo=[o for o in allorder[p] if o['eg'] in sk]
              hh=[h for h in history[p] if h['cnpj'].endswith('3401' if p=='8952380' else '6418') and h['ean'] in ({'7891149102815','7891991297189','7891149100378'} if p=='8952380' else {'7891991308007'})]
              cdetails[p]={'history':hh,'order':oo,'history_cnpj_clients_global':{c:[{'client_eg':v[0],'client_sap':v[1],'name':v[2],'network':v[3],'rows':num} for v,num in clients[c].most_common()] for c in {h['cnpj'] for h in hh}}}
          print('QA_DETAIL_CLIENT',json.dumps({'ox_history':oxh,'ox_order':oxo,'ox_cad':oxcad,'cnpj_cases':cdetails},ensure_ascii=False))
          PY
