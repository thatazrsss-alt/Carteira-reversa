          ownstats=collections.Counter(); active_own=collections.Counter(); absent_stats=collections.Counter(); code_context=collections.Counter(); qty_stats=collections.Counter(); order_eans=collections.Counter(); absent_active=collections.Counter()
          for (p,c),oo in group.items():
              hh=hist[p]; isactive=any(o['valid']>='2026-11-27' and 'CANCELAD' not in o['status'] for o in oo)
              direct=[h for h in hh if any(match(o,h) and comp(o,h) for o in oo)]
              alt=[h for h in hh if any(match(o,h) and comp(o,h,True) for o in oo)]
              bucket='direct' if len(uq(direct))==1 else 'alternative' if len(uq(alt))==1 else 'missing_erp' if not hh else 'date_unresolved' if any(match(o,h) for o in oo for h in hh) else 'missing_product'
              if bucket in ('direct','alternative'):
                  h=(direct or alt)[0]
                  own=owners(p,h)
                  # Conservative: any other SKU or client using the same History identifier, even outside original dates, is counted separately.
                  rawowners={(o['client'],o['sku']) for o in allorder[p] if (not(o['cnpj'] and h['cnpj']) or o['cnpj']==h['cnpj']) and match(o,h)}
                  verdict='exclusive' if own=={(c,'360248')} else 'competing'
                  ownstats[bucket+'_'+verdict]+=1
                  if rawowners-{(c,'360248')}:ownstats[bucket+'_other_owner_ignoring_dates']+=1
                  if isactive:active_own[bucket+'_'+verdict]+=1
                  if bucket=='alternative':
                      qty_stats['alternative_original_equal']+=bool(h['qty'] is not None and any(o['original']==h['qty'] for o in oo))
                      qty_stats['alternative_movement_exceeds_entry']+=bool(h['qty'] is not None and sum((o['qty'][1]+o['qty'][3] for o in oo if None not in o['qty']),D(0))>h['qty'])
                  continue
              if bucket=='missing_product':
                  absent_stats['groups']+=1
                  if isactive:absent_active['groups']+=1
                  hh_c=[h for h in hh if any(not(o['cnpj'] and h['cnpj']) or o['cnpj']==h['cnpj'] for o in oo)]
