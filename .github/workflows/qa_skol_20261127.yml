name: QA 27-11 - historico complementar e identidade
on:
  push:
    branches: ['qa/skol-20261127']
    paths: ['.github/workflows/qa_skol_20261127.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install openpyxl
      - name: Reconciliar todos os SKUs
        run: |
          python - <<'PY'
          import csv,io,zipfile,re,unicodedata,collections,json,decimal,datetime
          D=decimal.Decimal
          import functools
          @functools.lru_cache(maxsize=250000)
          def n(x):
              s=unicodedata.normalize('NFKC',str(x or '')).strip().upper()
              s=re.sub(r'[\s\u200b\ufeff]+','',s)
              if re.fullmatch(r'\d+(\.0+)?',s): return str(int(s.split('.')[0]))
              return s
          def hdr(x):
              return re.sub(r'[^a-z0-9]','',unicodedata.normalize('NFKD',x).encode('ascii','ignore').decode().lower())
          @functools.lru_cache(maxsize=20000)
          def day(x):
              s=str(x or '').strip()
              for fmt in ('%d/%m/%Y','%Y-%m-%d'):
                  try: return datetime.datetime.strptime(s[:10],fmt).date().isoformat()
                  except ValueError: pass
              return ''
          @functools.lru_cache(maxsize=100000)
          def q(x):
              s=str(x or '').strip()
              if not s:return D(0)
              if ',' in s:s=s.replace('.','').replace(',','.')
              try:return D(s)
              except decimal.InvalidOperation:return None
          def rows(path):
              with zipfile.ZipFile(path) as z:
                  names=[i for i in z.namelist() if i.lower().endswith('.csv')]
                  assert len(names)==1, names
                  raw=z.read(names[0]).rstrip(b'\0')
              try: txt=raw.decode('utf-8-sig')
              except UnicodeDecodeError: txt=raw.decode('cp1252')
              r=csv.DictReader(io.StringIO(txt),delimiter=';')
              print('SCHEMA',path,json.dumps(r.fieldnames,ensure_ascii=False))
              return r
          def find(r,*aliases):
              return next((r[k] for k in aliases if k in r),'')
          def orderrow(r):
              return {'p':n(find(r,'Nº Pedido ERP','Número Pedido ERP')),'client':n(find(r,'Cliente EG')),'sku':n(find(r,'SKU EG')),'code':n(find(r,'Código Produto Cliente')),'ean':n(find(r,'EAN')),'date':day(find(r,'Data Captação ECC','Data Captação')),'valid':day(find(r,'Data de Vencimento','Data Vencimento')),'cnpj':n(find(r,'CNPJ Cliente','CNPJ','CNPJ do Cliente')),'created':day(find(r,'Data de Criação')),'original_valid':day(find(r,'Data de Vencimento Original')),'item':n(find(r,'Número do Item')),'net':n(find(r,'Nome Rede')),'origin':n(find(r,'Origem')),'realoc':n(find(r,'Tipo de realocação')),'realoc_qty':q(find(r,'Qtd. Realocada')),'order_id':n(find(r,'Nº Pedido Ambev')),'sap':n(find(r,'SKU SAP')),'desc':n(find(r,'Descrição Produto Cliente')),'bees':n(find(r,'Nº Pedido Bees AS')),'status':n(find(r,'Status')),'unit':n(find(r,'Unidade')),'original':q(find(r,'Qtd. Original')) if str(find(r,'Qtd. Original') or '').strip() else None,'mode':n(find(r,'Modo')),'channel':n(find(r,'Tipo Pedido')),'qty':[q(find(r,k)) for k in ('Qtd. Atualizada','Qtd. Carro com remessa','Qtd. Carro sem remessa','Qtd. Faturada')]}
          def histrow(r):
              return {'p':n(find(r,'Nº Pedido ERP','Número Pedido ERP')),'code':n(find(r,'Código Produto Cliente')),'ean':n(find(r,'EAN')),'date':day(find(r,'Data de Criação','Data Criação')),'valid':day(find(r,'Data de Vencimento','Data Vencimento')),'cnpj':n(find(r,'CNPJ Cliente','CNPJ','CNPJ do Cliente')),'desc':n(find(r,'Descrição Produto Cliente')),'bees':n(find(r,'Nº Pedido Bees AS')),'item':n(find(r,'Número do Item','Nº Item','Item')),'qty':q(find(r,'Qtd. Pedida'))}
          import openpyxl
          op='2026.11.27_10.22 ExportReportOrderItem ultimo.zip'
          hp='2026.11.27_10.24 ExportReportOrderHistory ultimo.zip'
          ref='2026-11-27'
          src=collections.Counter(); groups=collections.defaultdict(list); erps=set(); units=collections.Counter(); nets=set(); skus=set()
          for r in rows(op):
              src['order_rows']+=1
              o=orderrow(r); g=(o['p'],o['client'],o['sku'])
              if not all(g) or 'TESTE' in g[0]:
                  src['order_excluded']+=1;continue
              groups[g].append(o);erps.add(g[0]);units[o['unit']]+=1;nets.add(o['net']);skus.add(g[2])
          hist=[]; hi=collections.defaultdict(set); he=collections.Counter(); hd=collections.Counter(); hdups=set(); hs=collections.Counter()
          for r in rows(hp):
              src['history_rows']+=1
              h=histrow(r); p=h['p']
              if not p or 'TESTE' in p:
                  src['history_excluded']+=1;continue
              he[p]+=1;hd[h['date']]+=1
              if p not in erps:continue
              if not (h['code'] or h['ean']):
                  src['history_without_product_code_in_common_erp']+=1;continue
              key=(p,h['cnpj'],h['code'],h['ean'],h['date'],h['valid'],h['item'],h['qty'])
              if key in hdups:
                  src['history_identical_snapshots']+=1;continue
              hdups.add(key);i=len(hist);hist.append(h)
              for k in ('code','ean'):
                  if h[k]:
                      hi[(p,k,h[k])].add(i)
          del hdups
          print('QA_INVENTORY',json.dumps({'sources':dict(src),'order_keys':len(groups),'order_erps':len(erps),'history_erps':len(he),'common_erps':len(erps&he.keys()),'skus':len(skus),'networks':len(nets-{''}),'units_rows':dict(units),'history_date_range':[min(x for x in hd if x),max(hd)],'history_distinct_relevant_rows':len(hist)},ensure_ascii=False))
          wb=openpyxl.load_workbook('BASE_ESTOQUE 16.11.xlsx',read_only=True,data_only=True)
          cad=next(x for x in wb if hdr(x.title)=='cad'); it=iter(cad.values); header=next(it); names=[hdr(str(v or '')) for v in header]
          si=names.index('codprod'); ecols=[i for i,x in enumerate(names) if x in ('ean13sku','ean13unitario')]
          ca=collections.defaultdict(set); reverse=collections.defaultdict(set); factors=collections.defaultdict(set)
          for r in it:
              sku=n(r[si]); 
              if not sku:continue
              for j in [names.index('qtdinternasku')]:
                  x=q(str(r[j] or ''))
                  if x and x>0:factors[sku].add(x)
              for j in ecols:
                  val=n(r[j])
                  if val and val not in ('0','1','-'):ca[sku].add(val);reverse[val].add(sku)
          wb.close()
          print('QA_CAD',json.dumps({'skus_in_order':len(skus),'with_cad_ean':sum(bool(ca[x]) for x in skus),'ean_shared_by_multiple_skus':sum(len(v)>1 for v in reverse.values())}))
          def context(o,h,alt=False):
              return (not(o['cnpj'] and h['cnpj']) or o['cnpj']==h['cnpj']) and (not(o['date'] and h['date']) or h['date']==o['date'] or (alt and h['date']==o['created'])) and (not(o['valid'] and h['valid']) or h['valid']==o['valid'] or (alt and h['valid']==o['original_valid']))
          # Candidate owners include exact and cross-column matches and unambiguous CAD aliases.
          chosen={}; own=collections.defaultdict(set); candidate_info={}
          for g,oo in groups.items():
              p,c,sku=g; direct=set(); alt=set(); cross=set(); cadset=set(); raw=set()
              for o in oo:
                  equal=set(); crossed=set()
                  for k,other in (('code','ean'),('ean','code')):
                      if o[k]:
                          equal.update(hi.get((p,k,o[k]),()))
                          crossed.update(hi.get((p,other,o[k]),()))
                  raw.update(equal)
                  direct.update(i for i in equal if context(o,hist[i]))
                  alt.update(i for i in equal if context(o,hist[i],True))
                  cross.update(i for i in crossed if context(o,hist[i],True))
                  for v in ca[sku]:
                      if reverse[v]!={sku}:continue
                      for k in ('ean','code'):
                          cadset.update(i for i in hi.get((p,k,v),()) if context(o,hist[i],True))
              # Priority direct, alternative dates, cross field, then CAD. Never select multiple records.
              tier='direct' if direct else 'alternative_dates' if alt else 'cross_field' if cross else 'cad_alias' if cadset else ''
              cand=direct or alt or cross or cadset
              if len(cand)==1:chosen[g]=(next(iter(cand)),tier)
              for i in direct|alt|cross|cadset:own[i].add(g)
              candidate_info[g]=(tier,len(cand),bool(raw))
          print('QA_MATCH_STAGE',len(chosen))
          # Separate prior snapshot: do not blend quantities or count the same History key twice.
          prev=[]; pi=collections.defaultdict(set); pe=set(); pd=collections.Counter(); prev_seen=set(); curr_sig=set(); curr_id=collections.defaultdict(set)
          def signature(h):return (h['p'],h['cnpj'],h['code'],h['ean'],h['date'],h['valid'],h['item'])
          for i,h in enumerate(hist):
              curr_sig.add(signature(h));curr_id[signature(h)].add(h['qty'])
          for row in rows('History.zip'):
              h=histrow(row);p=h['p'];pe.add(p);pd[h['date']]+=1
              if p not in erps:continue
              key=signature(h)+(h['qty'],)
              if key in prev_seen:continue
              prev_seen.add(key);i=len(prev);prev.append(h)
              for k in ('code','ean'):
                  if h[k]:pi[(p,k,h[k])].add(i)
          print('QA_PREV_INVENTORY',json.dumps({'rows':sum(pd.values()),'date_min':min(x for x in pd if x),'date_max':max(pd),'erp_overlap':len(erps&pe),'relevant_unique_rows':len(prev),'same_signature_as_current':sum(signature(h) in curr_sig for h in prev),'same_signature_conflicting_quantity':sum(signature(h) in curr_sig and h['qty'] not in curr_id[signature(h)] for h in prev)}))
          # Learn client-specific codes only from strong current matches; never from quantity.
          code_map=collections.defaultdict(set); code_support=collections.Counter(); desc_map=collections.defaultdict(set)
          current_good={}
          for g,pick in chosen.items():
              i,tier=pick
              if own[i]!={g} or hist[i]['qty'] is None or hist[i]['qty']<=0:continue
              current_good[g]=i
              h=hist[i];oo=groups[g];netset={o['net'] for o in oo if o['net']}
              if len(netset)!=1:continue
              net=next(iter(netset));sku=g[2]
              for v in {h['code'],h['ean']}-{''}:
                  code_map[(net,v)].add(sku);code_support[(net,v,sku)]+=1
              if h['desc']:desc_map[(net,h['desc'])].add(sku)
          h_by_erp=collections.defaultdict(list)
          for i,h in enumerate(hist):h_by_erp[h['p']].append(i)
          # Prior candidates generated for all groups to test exclusive ownership across the entire Order.
          prior_candidates={};prior_owners=collections.defaultdict(set); new_candidates={};new_owners=collections.defaultdict(set)
          for g,oo in groups.items():
              p,c,sku=g;pc=set();nc=set()
              for o in oo:
                  ids={o['code'],o['ean']}-{''}
                  ids|={v for v in ca[sku] if reverse[v]=={sku}}
                  for v in ids:
                      for k in ('ean','code'):
                          pc.update(i for i in pi.get((p,k,v),()) if context(o,prev[i],True))
                  for i in h_by_erp[p]:
                      h=hist[i]
                      if not context(o,h,True):continue
                      if not o['cnpj'] or h['cnpj']!=o['cnpj']:continue
                      if any(code_map[(o['net'],v)]=={sku} and code_support[(o['net'],v,sku)]>=2 for v in {h['code'],h['ean']}-{''}):
                          nc.add(i)
              prior_candidates[g]=pc;new_candidates[g]=nc
              for i in pc:prior_owners[i].add(g)
              for i in nc:new_owners[i].add(g)
          result=collections.defaultdict(collections.Counter); detail=collections.defaultdict(collections.Counter);vol=collections.defaultdict(lambda:collections.defaultdict(lambda:D(0)))
          for g,oo in groups.items():
              if g in current_good:continue
              p,c,sku=g;active=any(o['valid']>=ref and 'CANCELAD' not in o['status'] and 'AGUARDANDOCANCELAMENTO' not in o['status'] for o in oo)
              orig={o['original'] for o in oo if o['original'] is not None}
              pc=prior_candidates[g];nc=new_candidates[g]
              pp=[i for i in pc if prior_owners[i]=={g} and prev[i]['qty'] is not None and prev[i]['qty']>0]
              nn=[i for i in nc if new_owners[i]=={g} and not (own[i]-{g}) and hist[i]['qty'] is not None and hist[i]['qty']>0]
              # A candidate already claimed by another group in current History cannot be recycled via a prior snapshot.
              # Check candidate signature against current owners directly.
              pp=[i for i in pp if not any(own[j]-{g} for k in ('code','ean') if prev[i][k] for j in hi.get((p,k,prev[i][k]),()) if signature(hist[j])==signature(prev[i]))]
              pv=prev[pp[0]] if len(pc)==1 and len(pp)==1 else None
              nv=hist[nn[0]] if len(nc)==1 and len(nn)==1 else None
              for lab in ['all']+(['active'] if active else []):
                  z=result[lab];z['unmatched']+=1;z['erp_in_prior']+=p in pe;z['prior_candidate']+=bool(pc);z['prior_unique_exclusive']+=bool(pv);z['prior_unique_exact_original']+=bool(pv and len(orig)==1 and pv['qty'] in orig);z['prior_unique_any_original']+=bool(pv and pv['qty'] in orig)
                  z['current_learned_code_candidate']+=bool(nc);z['current_learned_code_unique_exclusive']+=bool(nv);z['current_learned_code_exact_original']+=bool(nv and len(orig)==1 and nv['qty'] in orig);z['current_learned_code_any_original']+=bool(nv and nv['qty'] in orig)
                  z['either_unique']+=bool(pv or nv);z['both_same_qty']+=bool(pv and nv and pv['qty']==nv['qty']);z['both_conflict']+=bool(pv and nv and pv['qty']!=nv['qty'])
                  z['erp_in_neither']+=p not in he and p not in pe
                  # Quantities are checks only, never used as matching keys.
                  if pv and len(orig)==1 and pv['qty'] not in orig:z['prior_qty_mismatch']+=1
                  if nv and len(orig)==1 and nv['qty'] not in orig:z['learned_qty_mismatch']+=1
                  if pv and not nv and signature(pv) not in curr_sig:z['prior_unique_new_history_record']+=1
                  if not pv and not nv:
                      detail[lab]['erp_absent_both' if p not in he and p not in pe else 'erp_present_but_no_exclusive_identity']+=1
          print('QA_SUPPLEMENT',json.dumps({'counts':{k:dict(v) for k,v in result.items()},'remaining':{k:dict(v) for k,v in detail.items()},'learned_unique_code_count':sum(len(x)==1 for x in code_map.values())},ensure_ascii=False))
          PY
