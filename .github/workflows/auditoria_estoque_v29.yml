name: Auditoria Real BASE_ESTOQUE - Carteira Reversa v29
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/auditoria_estoque_v29.yml'
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Conferir as abas e cruzamentos reais da base de estoque
        run: |
          python - <<'PY'
          import zipfile, xml.etree.ElementTree as ET, posixpath, re, json, collections, unicodedata
          from pathlib import Path
          N='{http://schemas.openxmlformats.org/spreadsheetml/2006/main}'
          R='{http://schemas.openxmlformats.org/officeDocument/2006/relationships}'
          P='{http://schemas.openxmlformats.org/package/2006/relationships}'
          def norm(s):
            return re.sub(r'[^a-z0-9]+',' ',''.join(x for x in unicodedata.normalize('NFD',str(s or '').lower()) if unicodedata.category(x)!='Mn')).strip()
          def num(v):
            try:
              s=str(v).strip()
              if ',' in s:s=s.replace('.','').replace(',','.')
              return float(s)
            except:return None
          def col(s):
            n=0
            for x in re.match(r'[A-Z]+',s).group(0):n=n*26+ord(x)-64
            return n-1
          def it(z,path,strings):
            with z.open(path) as f:
              for _,r in ET.iterparse(f,events=('end',)):
                if r.tag!=N+'row':continue
                row={}
                for c in r.findall(N+'c'):
                  v=c.find(N+'v')
                  if c.get('t')=='inlineStr':value=''.join(x.text or '' for x in c.iter(N+'t'))
                  elif v is None:value=''
                  elif c.get('t')=='s':
                    try:value=strings[int(v.text)]
                    except:value=''
                  else:value=v.text or ''
                  if value:row[col(c.get('r'))]=value
                yield row
                r.clear()
          aliases={'eg':['sku eg','eg','codigo produto eg','codigoproduto','cod prod','codigo produto','codigo produto pca'],
            'sap':['sap','codigo sap','cod sap','sku sap','material sap'],
            'factor':['quantidade prod pallet','caixas por pallet','cx por pallet','cx por plt','fator cx plt'],
            'factory':['origem','orig s4','orig ecc','orig pca','fabrica','origem sap'],
            'commercial':['comercial','codigo comercial'],
            'stock_plt':['d1','estoque plt','saldo plt','estoque pallet','estoque em pallet'],
            'stock_cx':['saldodisponivel','saldo disponivel','saldo cx','estoque cx'],
            'center':['centro','cdd','lista'],
            'production_date':['producao','data producao']}
          source=Path('BASE_ESTOQUE 16.11.xlsx')
          with zipfile.ZipFile(source) as z:
            strs=[]
            if 'xl/sharedStrings.xml' in z.namelist():
              with z.open('xl/sharedStrings.xml') as fd:
                for _,x in ET.iterparse(fd,events=('end',)):
                  if x.tag==N+'si':strs.append(''.join(v.text or '' for v in x.iter(N+'t')));x.clear()
            wb=ET.fromstring(z.read('xl/workbook.xml'))
            rels=ET.fromstring(z.read('xl/_rels/workbook.xml.rels'))
            mapping={x.get('Id'):x.get('Target') for x in rels.findall(P+'Relationship')}
            report={'file':source.name,'size_bytes':source.stat().st_size,'sheets':[]}
            for sheet in wb.findall('.//'+N+'sheet'):
              title=sheet.get('name');target=mapping.get(sheet.get(R+'id'))
              if not target:continue
              target=target.lstrip('/') if target.startswith('/') else posixpath.normpath(posixpath.join('xl',target))
              if target not in z.namelist():continue
              gen=it(z,target,strs);first=[]
              for _,x in zip(range(50),gen):first.append(x)
              best=(-999,0,{})
              for index,row in enumerate(first):
                vs=[norm(v) for v in row.values()]
                hits=sum(any(a in v for ls in aliases.values() for a in ls) for v in vs)
                score=hits*10+len(vs)*.01-sum(num(v)is not None for v in vs)*2
                if hits and score>best[0]:best=(score,index,row)
              _,hi,head=best
              fields={}
              for k,options in aliases.items():
                for name in options:
                  found=next((idx for idx,v in head.items() if norm(v)==name),None)
                  if found is not None:fields[k]=found;break
              ctr=collections.Counter();seen={};rows=0
              for line in first[hi+1:]:
                if line:
                  rows+=1
                  for f in ('factor','stock_plt','stock_cx'):
                    v=num(line.get(fields[f])) if f in fields else None
                    if v is not None:
                      ctr[f+'_numeric']+=1
                      if v<0:ctr[f+'_negative']+=1
                  if 'eg' in fields:
                    key=norm(line.get(fields['eg']))
                    if key:
                      if key in seen:ctr['eg_repetido']+=1
                      else:seen[key]=1
              for line in gen:
                if line:
                  rows+=1
                  for f in ('factor','stock_plt','stock_cx'):
                    v=num(line.get(fields[f])) if f in fields else None
                    if v is not None:
                      ctr[f+'_numeric']+=1
                      if v<0:ctr[f+'_negative']+=1
                  if 'eg' in fields:
                    key=norm(line.get(fields['eg']))
                    if key:
                      if key in seen:ctr['eg_repetido']+=1
                      else:seen[key]=1
              report['sheets'].append({'sheet':title,'header_row':hi+1,'rows':rows,'columns':[str(head[k]) for k in sorted(head)][:55],'matched_fields':{k:head[v] for k,v in fields.items()},'stats':dict(ctr),'distinct_EG':len(seen)})
          Path('auditoria').mkdir(exist_ok=True)
          Path('auditoria/inventario_base_estoque.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          print('AUDITORIA_V29_INICIO')
          print(json.dumps(report,ensure_ascii=False))
          print('AUDITORIA_V29_FIM')
          # Conferência cruzada específica aos cabeçalhos observados no arquivo real.
          def raw_records(book, sheet_name, ss):
            x=next(k for k in book.findall('.//'+N+'sheet') if k.get('name')==sheet_name)
            t=mapping[x.get(R+'id')]
            t=t.lstrip('/') if t.startswith('/') else posixpath.normpath(posixpath.join('xl',t))
            rows=it(z,t,ss);head=next(rows);labels={str(v):k for k,v in head.items()}
            for row in rows:yield {name:row.get(i) for name,i in labels.items()}
          from collections import defaultdict
          with zipfile.ZipFile(source) as z:
            cad=list(raw_records(wb,'CAD',strs))
            malha=list(raw_records(wb,'Malha',strs))
            factory=list(raw_records(wb,'Estoque Fabricas',strs))
          eg_to_ratios=defaultdict(set);sap_to_egs=defaultdict(set);stock_eg=set();stock_orig_s4=collections.Counter();stock_orig_pca=collections.Counter()
          negatives_by_attribute=collections.Counter();malha_origins=collections.Counter();malha_commercial=collections.Counter()
          for x in cad:
            eg=norm(x.get('Cód_Prod'));sap=norm(x.get('Cod_SAP'));ratio=num(x.get('Quantidade_prod_pallet'))
            if eg:
              eg_to_ratios[eg].add(ratio)
              if sap:sap_to_egs[sap].add(eg)
          for x in factory:
            eg=norm(x.get('Sku PCA'));s4=norm(x.get('Orig. S4'));pca=norm(x.get('Orig. PCA'))
            if eg:stock_eg.add(eg)
            if s4:stock_orig_s4[s4]+=1
            if pca:stock_orig_pca[pca]+=1
            d1=num(x.get('D1'))
            if d1 is not None and d1<0:negatives_by_attribute[norm(x.get('Atributo'))]+=1
          malha_linked=0;malha_missed=0;malha_stock_eg=0
          for x in malha:
            sap=norm(x.get('SKU SAP'));orig=norm(x.get('Fábrica Origem SAP'));commercial=norm(x.get('Destino Comercial'))
            if orig:malha_origins[orig]+=1
            if commercial:malha_commercial[commercial]+=1
            egs=sap_to_egs.get(sap,set())
            if egs:
              malha_linked+=1
              if any(e in stock_eg for e in egs):malha_stock_eg+=1
            else:malha_missed+=1
          detail={'cad_unique_eg':len(eg_to_ratios),'cad_eg_conflicting_factors':sum(len(v)>1 for v in eg_to_ratios.values()),
            'cad_eg_missing_stock_factory':sum(e not in stock_eg for e in eg_to_ratios),
            'malha_rows':len(malha),'malha_sap_with_cad':malha_linked,'malha_sap_without_cad':malha_missed,
            'malha_sap_cad_eg_with_factory_stock_any_origin':malha_stock_eg,
            'factory_unique_eg':len(stock_eg),
            'malha_origin_codes':dict(malha_origins.most_common(25)),
            'factory_orig_s4_codes':dict(stock_orig_s4.most_common(25)),
            'factory_orig_pca_codes':dict(stock_orig_pca.most_common(25)),
            'negative_d1_by_attribute':dict(negatives_by_attribute)}
          Path('auditoria/crosscheck_estoque.json').write_text(json.dumps(detail,indent=2,ensure_ascii=False),encoding='utf-8')
          print('CROSSCHECK_REAL_V29_INICIO')
          print(json.dumps(detail,ensure_ascii=False))
          print('CROSSCHECK_REAL_V29_FIM')
          # Diagnóstico de chaves alternativas antes de definir o de/para oficial.
          candidates=['Cod S4','Cod_SAP','Cód_Prod','cod_prod_sku_s_dv','cod_dv_prod_sku','cod_prod_unit']
          malha_skus=[norm(x.get('SKU SAP')) for x in malha if norm(x.get('SKU SAP'))]
          malha_set=set(malha_skus)
          matches={}
          for colname in candidates:
            values={norm(x.get(colname)) for x in cad if norm(x.get(colname))}
            inter=values & malha_set
            matches[colname]={'cad_distinct':len(values),'malha_sku_distinct_matched':len(inter),
                 'malha_rows_matched':sum(x in values for x in malha_skus)}
          cad_eg={norm(x.get('Cód_Prod')) for x in cad if norm(x.get('Cód_Prod'))}
          stock_to_cad={}
          for name in ['Sku S4','Sku ECC','Sku PCA']:
            values={norm(x.get(name)) for x in factory if norm(x.get(name))}
            stock_to_cad[name]={'stock_distinct':len(values),'stock_codes_present_in_CAD_Cod_Prod':len(values & cad_eg)}
          # Checar diferenças puramente de preenchimento com zeros à esquerda.
          def unpad(v):return v.lstrip('0') if v.isdigit() else v
          malha_unpad={unpad(x) for x in malha_set}
          for colname in candidates:
            values={unpad(norm(x.get(colname))) for x in cad if norm(x.get(colname))}
            matches[colname]['unique_matched_without_leading_zero']=len(values&malha_unpad)
          detail2={'malha_sku_distinct':len(malha_set),'malha_sku_nonempty_rows':len(malha_skus),
                   'cad_column_candidates':matches,'stock_vs_cad_eg_candidates':stock_to_cad}
          Path('auditoria/diagnostico_chaves_v29.json').write_text(json.dumps(detail2,indent=2,ensure_ascii=False),encoding='utf-8')
          print('DIAGNOSTICO_CHAVES_V29_INICIO')
          print(json.dumps(detail2,ensure_ascii=False))
          print('DIAGNOSTICO_CHAVES_V29_FIM')
          links=collections.defaultdict(lambda:collections.Counter())
          nameByPair=collections.defaultdict(lambda:collections.Counter())
          for r in factory:
            br=norm(r.get('Orig. S4')).upper();pca=norm(r.get('Orig. PCA'))
            name=str(r.get('Fábrica') or '').strip()
            if br and pca:
              links[br][pca]+=1
              if name:nameByPair[(br,pca)][name]+=1
          centers_report={
            'br_count':len(links),
            'ambiguous_br_to_pca':{br:dict(counts) for br,counts in links.items() if len(counts)>1},
            'centers':[{ 'br':br,'pca':next(iter(pcas)), 'rows':sum(pcas.values()),
                         'factory_name':nameByPair[(br,next(iter(pcas)))].most_common(1)[0][0] if nameByPair[(br,next(iter(pcas)))] else None}
                       for br,pcas in sorted(links.items()) if len(pcas)==1]}
          Path('auditoria/depara_origens_v29.json').write_text(json.dumps(centers_report,indent=2,ensure_ascii=False),encoding='utf-8')
          print('DEPARA_ORIGENS_V29_INICIO')
          print(json.dumps(centers_report,ensure_ascii=False))
          print('DEPARA_ORIGENS_V29_FIM')
          # Cruzamento por produto EG e BR de fábrica (presença de origem ≠ disponibilidade D1).
          eg_from_s4=collections.defaultdict(set)
          for x in cad:
            s4=norm(x.get('Cod S4'));eg=norm(x.get('Cód_Prod'))
            if s4 and eg:eg_from_s4[s4].add(eg)
          stock_pairs=set();positive_pairs=set();stock_attr=collections.Counter()
          for x in factory:
            eg=norm(x.get('Sku PCA'));br=norm(x.get('Orig. S4'));attr=norm(x.get('Atributo'));d=num(x.get('D1'))
            if eg and br:
              stock_pairs.add((eg,br))
              if d is not None and d>0 and 'estoque' in attr:positive_pairs.add((eg,br))
            if attr:stock_attr[attr]+=1
          by_origin_matched=0;by_origin_positive=0
          for x in malha:
            sku=norm(x.get('SKU SAP'));br=norm(x.get('Fábrica Origem SAP'))
            candidates=eg_from_s4.get(sku,set())
            if any((eg,br) in stock_pairs for eg in candidates):by_origin_matched+=1
            if any((eg,br) in positive_pairs for eg in candidates):by_origin_positive+=1
          prod=list(raw_records(wb,'Produção',strs)) if False else []
          # Voltar a abrir workbook apenas para conferir Produção / DeParaCDD.
          with zipfile.ZipFile(source) as z:
            prod=list(raw_records(wb,'Produção',strs))
            dpar=list(raw_records(wb,'DeParaCDD',strs))
          prod_codes={norm(x.get('COD_PROD')) for x in prod if norm(x.get('COD_PROD'))}
          prod_origins=collections.Counter(norm(x.get('ORIGEM')) for x in prod if norm(x.get('ORIGEM')))
          dpar_centers=collections.Counter(norm(x.get('CDD Footptint')) for x in dpar if norm(x.get('CDD Footptint')))
          audit3={'malha_rows':len(malha),'malha_rows_with_factory_sku_pair':by_origin_matched,
                  'malha_rows_with_positive_D1_stock_pair':by_origin_positive,
                  'stock_distinct_sku_factory_pairs':len(stock_pairs),'stock_positive_D1_sku_factory_pairs':len(positive_pairs),
                  'stock_attribute_counts':dict(stock_attr),
                  'production_unique_skus':len(prod_codes),'production_skus_found_in_CAD_EG':len(prod_codes&cad_eg),
                  'production_origins':dict(prod_origins.most_common(50)),'dpar_cdd_values':dict(dpar_centers)}
          Path('auditoria/conferencia_elegibilidade_v29.json').write_text(json.dumps(audit3,indent=2,ensure_ascii=False),encoding='utf-8')
          print('ELEGIBILIDADE_V29_INICIO')
          print(json.dumps(audit3,ensure_ascii=False))
          print('ELEGIBILIDADE_V29_FIM')
          # Compatibilidade real Grade CD: SKU EG sem dígito verificador versus CodigoProduto.
          def digits(v):
            x=re.sub(r'[ .-]','',str(v or '').strip())
            return x if x.isdigit() else ''
          eg_minus_digit={x[:-1] for r in cad if len(x:=digits(r.get('Cód_Prod')))>1}
          grades={}
          with zipfile.ZipFile(source) as z:
            for sh in wb.findall('.//'+N+'sheet'):
              name=sh.get('name')
              if not name.startswith('Estoque CDD '):continue
              rec=list(raw_records(wb,name,strs))
              codes=[digits(x.get('CodigoProduto')) for x in rec]
              matched=sum(code in eg_minus_digit for code in codes if code)
              grade_stats={'rows':len(rec),'unique_products':len(set(codes)),
                'sku_matched_cad_without_digit':matched,
                'sku_not_matched':sum(bool(code) and code not in eg_minus_digit for code in codes),
                'negative_balance':sum((num(x.get('SaldoDisponivel')) or 0)<0 for x in rec)}
              grades[name]=grade_stats
          grade_report={'cad_without_digit_unique':len(eg_minus_digit),'grades':grades,'total_rows':sum(x['rows'] for x in grades.values()),
                 'total_matched':sum(x['sku_matched_cad_without_digit'] for x in grades.values())}
          Path('auditoria/grade_cd_v29.json').write_text(json.dumps(grade_report,indent=2,ensure_ascii=False),encoding='utf-8')
          print('GRADE_CD_V29_INICIO')
          print(json.dumps(grade_report,ensure_ascii=False))
          print('GRADE_CD_V29_FIM')
          # Divergências de Malha ficam num artefato de auditoria, não em logs abertos.
          exceptions=[]
          for x in malha:
            sku=norm(x.get('SKU SAP'));br=norm(x.get('Fábrica Origem SAP'))
            candidates=eg_from_s4.get(sku,set())
            if not candidates:reason='SAP_SEM_CAD_COD_S4'
            elif not any((eg,br) in stock_pairs for eg in candidates):reason='SEM_PAR_SKU_FABRICA_D1'
            else:continue
            exceptions.append({'sku_sap':str(x.get('SKU SAP') or ''),'origem_br':str(x.get('Fábrica Origem SAP') or ''),'motivo':reason})
          Path('auditoria/excecoes_malha_v29.json').write_text(json.dumps(exceptions,indent=2,ensure_ascii=False),encoding='utf-8')
          print('Excecoes Malha sem par SKU/fabrica:',len(exceptions),'(lista apenas no artefato de auditoria).')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-estoque-v29
          path: auditoria/inventario_base_estoque.json
          if-no-files-found: warn
